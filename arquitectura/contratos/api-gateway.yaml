openapi: 3.0.0
info:
  title: Discordia API Gateway
  version: 1.0.0
  description: >
    Punto único de entrada al sistema (RNF — Componentes). Centraliza el
    enrutamiento hacia `identity`, `community` y `chat-y-real-time`, la
    validación de tokens de sesión (JWT) y el rate limiting. No implementa
    lógica de negocio propia: cada path espeja el contrato del servicio de
    origen (ver identity.yaml, community.yaml, chat.yaml) y agrega
    únicamente las políticas transversales documentadas en INF-10.

    Correspondencia de ruteo para el camino crítico del Sprint 1:
    - /api/v1/users*, /api/v1/sessions* → identity
    - /api/v1/servers*, /api/v1/invites* → community
    - /api/v1/channels/{channelId}/messages, /api/v1/channels/{channelId}/ws → chat-y-real-time
    - /api/v1/admin/users* → identity (backoffice, solo staff)
    El gateway valida el JWT recibido en `Authorization: Bearer <token>` y,
    antes de reenviar la request al servicio correspondiente, la enriquece
    con dos headers internos derivados de su payload (ver JwtClaims en
    identity.yaml):
    - `X-User-Id`: el `sub` del JWT (userId).
    - `X-User-Role`: el `role` del JWT (`user` o `staff`), un solo valor.
    El gateway siempre pisa esos headers, así que un cliente no puede
    falsificarlos. Antes de reenviar, también rechaza con 401 los tokens
    cuyo `jti` está revocado (ADR-0010), incluido el handshake del
    WebSocket: un usuario suspendido no puede reconectarse.
    Los servicios downstream (`identity`, `community`, `chat-y-real-time`)
    no vuelven a validar la firma del JWT ni lo reciben ellos mismos en la
    mayoría de sus endpoints — confían en esos dos headers dentro de la red
    interna. La única excepción es `identity`, que en los endpoints que
    manipulan la sesión en sí (logout, refresh) sigue requiriendo el JWT
    completo, no solo los headers derivados.

servers:
  - url: https://api.discordia.example.com
    description: Entorno de producción (único punto de entrada público)
  - url: http://localhost:8000
    description: Entorno local

paths:
  /api/v1/users:
    post:
      summary: '[proxy → identity] Registrar un nuevo usuario'
      operationId: gatewayRegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'identity.yaml#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Ver identity.yaml → POST /users
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: 'identity.yaml#/components/schemas/AuthResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/sessions:
    post:
      summary: '[proxy → identity] Login'
      operationId: gatewayLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'identity.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Ver identity.yaml → POST /sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: 'identity.yaml#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: >
            Límite de intentos de login por IP y/o por cuenta excedido
            (RNF — Rate limiting).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: '[proxy → identity] Logout'
      operationId: gatewayLogout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Ver identity.yaml → DELETE /sessions
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sessions/refresh:
    post:
      summary: '[proxy → identity] Refresh de sesión'
      operationId: gatewayRefreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Ver identity.yaml → POST /sessions/refresh
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me:
    get:
      summary: '[proxy → identity] Ver perfil propio'
      operationId: gatewayGetOwnProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ver identity.yaml → GET /users/me
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: '[proxy → identity] Editar perfil propio'
      operationId: gatewayUpdateOwnProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'identity.yaml#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Ver identity.yaml → PATCH /users/me
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/avatar:
    put:
      summary: '[proxy → identity] Subir foto de perfil'
      operationId: gatewayUpdateAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Ver identity.yaml → PUT /users/me/avatar
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers:
    post:
      summary: '[proxy → community] Crear servidor'
      operationId: gatewayCreateServer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'community.yaml#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Ver community.yaml → POST /servers
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers/{serverId}:
    get:
      summary: '[proxy → community] Ver servidor'
      operationId: gatewayGetServer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Ver community.yaml → GET /servers/{serverId}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/servers/{serverId}/members/me:
    delete:
      summary: '[proxy → community] Abandonar servidor'
      operationId: gatewayLeaveServer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: Ver community.yaml → DELETE /servers/{serverId}/members/me
        '409':
          description: El usuario es owner; debe transferir la propiedad o eliminar el servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers/{serverId}/members/:
    get:
      summary: '[proxy → community] Listar miembros con sus roles'
      description: >
        La barra final es parte de la ruta: la tabla de rutas del gateway la
        declara así y no responde a la forma sin barra.
      operationId: gatewayListServerMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Ver community.yaml → GET /servers/{serverId}/members/
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'community.yaml#/components/schemas/ServerMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/servers/{serverId}/bans/{userId}:
    put:
      summary: '[proxy → community] Banear a un miembro del servidor'
      description: >
        Pide `BAN_MEMBERS` y respeta la jerarquía (SCRUM-69). Idempotente.
      operationId: gatewayBanServerMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Ver community.yaml → PUT .../bans/{userId}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/servers/{serverId}/invites:
    post:
      summary: '[proxy → community] Generar invitación'
      operationId: gatewayCreateInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'community.yaml#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Ver community.yaml → POST /servers/{serverId}/invites
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers/{serverId}/invites/{inviteId}:
    delete:
      summary: '[proxy → community] Revocar invitación'
      operationId: gatewayRevokeInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - in: path
          name: inviteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Ver community.yaml → DELETE /servers/{serverId}/invites/{inviteId}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invites/{code}:
    get:
      summary: '[proxy → community] Previsualizar invitación'
      description: No requiere autenticación, para poder mostrar el servidor antes del login/registro.
      operationId: gatewayPreviewInvite
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Ver community.yaml → GET /invites/{code}
        '410':
          description: Invitación expirada, revocada o inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: '[proxy → community] Unirse a servidor vía invitación'
      operationId: gatewayJoinServerByInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Ya era miembro (ver community.yaml → POST /invites/{code})
        '201':
          description: Se unió exitosamente
        '410':
          description: Invitación inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario baneado de este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers/{serverId}/channels:
    post:
      summary: '[proxy → community] Crear canal'
      operationId: gatewayCreateChannel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'community.yaml#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Ver community.yaml → POST /servers/{serverId}/channels
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: '[proxy → community] Listar canales'
      operationId: gatewayListChannels
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Ver community.yaml → GET /servers/{serverId}/channels
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/servers/{serverId}/channels/{channelId}:
    patch:
      summary: '[proxy → community] Editar canal'
      operationId: gatewayUpdateChannel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'community.yaml#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Ver community.yaml → PATCH /servers/{serverId}/channels/{channelId}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: '[proxy → community] Eliminar canal'
      operationId: gatewayDeleteChannel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Ver community.yaml → DELETE /servers/{serverId}/channels/{channelId}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{channelId}/messages:
    get:
      summary: '[proxy → chat-y-real-time] Historial de mensajes de un canal'
      operationId: gatewayGetChannelMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - in: query
          name: before
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Ver chat.yaml → GET /channels/{channelId}/messages
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{channelId}/ws:
    get:
      summary: '[proxy → chat-y-real-time] Upgrade a WebSocket para un canal'
      description: >
        El gateway valida el JWT en el handshake antes de completar el
        upgrade y de rutear la conexión persistente hacia una instancia del
        servicio de chat (RNF — Autorización para unirse a un canal).
      operationId: gatewayChannelWebSocket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '101':
          description: Switching Protocols.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users:
    get:
      summary: '[proxy → identity] Listado de usuarios para el backoffice'
      description: >
        Solo staff: identity responde 403 si el rol del JWT no es `staff`.
      operationId: gatewayListUsersForAdmin
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [active, suspended]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Ver identity.yaml → GET /admin/users
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/servers/{serverId}/roles/:
    get:
      summary: '[proxy → community] Listar roles'
      operationId: gatewayListRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Ver community.yaml → GET /servers/{serverId}/roles/
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'community.yaml#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Quien pregunta no es miembro del servidor. Los bitmasks dicen qué
            puede hacer cada rol, así que no son dato público.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: '[proxy → community] Crear rol'
      operationId: gatewayCreateRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '201':
          description: Ver community.yaml → POST /servers/{serverId}/roles/
          content:
            application/json:
              schema:
                $ref: 'community.yaml#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/servers/{serverId}/roles/{roleId}:
    patch:
      summary: '[proxy → community] Editar los permisos de un rol'
      description: >
        Reemplaza los permisos del rol: lo que no venga en la lista queda
        revocado (SCRUM-61).
      operationId: gatewayUpdateRolePermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'community.yaml#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: Ver community.yaml → PATCH /servers/{serverId}/roles/{roleId}
          content:
            application/json:
              schema:
                $ref: 'community.yaml#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Sin `MANAGE_ROLES`, el rol está en su misma posición o por encima
            —lo que incluye editar su propio rol más alto—, o está concediendo
            `ADMINISTRATOR` sin tenerlo. La interfaz muestra el mismo mensaje
            ante este 403 y ante el 409. Ver community.yaml para los tres
            motivos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            CA2 de SCRUM-61 en su caso estricto: el rol que se edita es de
            menor posición y es su única fuente de `ADMINISTRATOR`. El caso
            típico —editar el propio rol más alto— responde 403.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/servers/{serverId}/roles/{roleId}/default:
    put:
      summary: '[proxy → community] Elegir el rol por defecto del servidor'
      description: >
        Marca el rol que reciben los nuevos miembros (SCRUM-63). Exclusivo e
        idempotente.
      operationId: gatewaySetDefaultRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Ver community.yaml → PUT .../roles/{roleId}/default
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/servers/{serverId}/roles/{roleId}/members/{userId}:
    put:
      summary: '[proxy → community] Darle un rol a un miembro'
      description: >
        Idempotente: repetirlo responde 204 igual (SCRUM-62).
      operationId: gatewayAssignRoleToMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Ver community.yaml → PUT .../roles/{roleId}/members/{userId}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: '[proxy → community] Quitarle un rol a un miembro'
      description: Idempotente igual que el `PUT` (SCRUM-62).
      operationId: gatewayRemoveRoleFromMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Ver community.yaml → DELETE .../roles/{roleId}/members/{userId}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ServerId:
      in: path
      name: serverId
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      in: path
      name: channelId
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      in: path
      name: roleId
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      in: path
      name: code
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Token ausente, inválido o expirado. El gateway rechaza la request antes de reenviarla al servicio downstream.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Token válido pero sin autorización para el recurso solicitado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Datos de la request que no pasan validación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit excedido (RNF — Rate limiting).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
