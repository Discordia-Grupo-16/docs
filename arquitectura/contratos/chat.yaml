openapi: 3.0.0
info:
  title: Discordia Chat Service API
  version: 1.0.0
  description: >
    Servicio `chat-y-real-time`. Cubre el camino crítico del Sprint 1
    (CP1): Enviar mensaje en un canal (#15); y del Sprint 2 (CP2): Historial
    y reconexión sin pérdida de mensajes (SCRUM-46) — paginación con cursor
    (`before`/`after`) y garantía de no pérdida al reconectar.
    Adaptado del contrato de referencia entregado por la cátedra: IDs pasan
    de integer a UUID para ser consistentes con `identity` y `community`, y
    channelId/authorId ahora referencian directamente los recursos de esos
    servicios (Channel.id de `community`, User.id de `identity`).

    Del Sprint 4: menciones (SCRUM-47) y preferencias de notificación por
    canal y por servidor, con el atajo de silenciar (SCRUM-78 y SCRUM-77).

servers:
  - url: http://localhost:8003
    description: Entorno local (detrás del API Gateway en producción)

paths:
  /channels/{channelId}/messages:
    get:
      summary: Retrieve the message history of a channel
      description: >
        Returns the channel's messages in ascending order (oldest first).
        Without params: returns the last 50 messages (initial load, CA1).
        ?before: scroll-up pagination. ?after: reconnection resync (CA2) —
        returns 404 if the anchor does not exist in this channel.

        No devuelve los mensajes borrados (SCRUM-45), pero un mensaje
        borrado sigue sirviendo como anchor de `before` y `after`. Los
        mensajes editados traen `editedAt` (SCRUM-44). Un cliente que se
        reconecta recibe con `after` los mensajes nuevos, pero no las
        ediciones ni los borrados de mensajes viejos: para eso vuelve a
        pedir la última página y la fusiona con lo que tiene.
      operationId: getChannelMessages
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
          description: Debe referenciar un Channel existente en `community`.
        - in: query
          name: before
          required: false
          schema:
            type: string
            format: uuid
          description: Id de mensaje para paginar hacia atrás (mensajes anteriores a este).
        - in: query
          name: after
          required: false
          schema:
            type: string
            format: uuid
          description: Id de mensaje para resync al reconectar (mensajes posteriores a este). Devuelve 404 si el anchor no existe en el canal.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A list of messages
          content:
            application/json:
              schema:
                type: object
                required: [data, hasMore]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  hasMore:
                    type: boolean
                    description: >
                      true cuando hay más mensajes disponibles más allá de la página devuelta.
                      Para ?after, true indica que el cliente debe seguir paginando para ponerse al día.
        '400':
          description: Parámetros inválidos (UUID malformado, limit no positivo, limit > 100, before y after simultáneos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: X-User-Id ausente o no es un UUID válido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor dueño del canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente, o el anchor de ?after/?before no existe en este canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/messages/{messageId}:
    patch:
      summary: Editar un mensaje propio
      description: >
        SCRUM-44. Reemplaza el `content` de un mensaje y lo marca como
        editado (`editedAt`). Solo lo puede editar su autor, y mientras siga
        siendo miembro activo del servidor con `VIEW_CHANNEL` y
        `SEND_MESSAGES`: a quien le sacaron el permiso de escribir no se le
        deja reescribir lo que ya dijo. Las reglas del `content` son las del
        envío (1 a 2000 caracteres, sin contar el espacio en los bordes).

        Orden de las validaciones: `X-User-Id` y UUID (401/400), canal (404),
        membresía y permisos (403), body (400) y, en la misma escritura, que el
        mensaje exista en el canal, no esté borrado (404) y sea del usuario
        (403). Así un 403 por permisos nunca depende del contenido.

        Si el `content` es igual al actual, responde `200` con el mensaje
        vigente, **sin** tocar `editedAt` y **sin** publicar nada. Si cambió,
        `chat` publica `chat.message.updated` para que las otras instancias
        avisen a sus clientes (frame `message.updated`).

        Menciones (SCRUM-47): al editar, `chat` vuelve a calcular `mentions`
        desde el `content` nuevo, con los permisos que el autor tiene en ese
        momento y las mismas reglas que al enviar (ver `Mentions`). Una
        mención agregada al editar **no avisa**: no genera frame `mention`.
        Sí cuenta en el `mentionCount` del `GET /users/me/unread`, que se
        calcula sobre `mentions` al leer, igual que una mención que se quita
        deja de contar.
      operationId: editMessage
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: El mensaje con su contenido vigente.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: UUID malformado, el body no es JSON, o `content` vacío o de más de 2000 caracteres.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es el autor del mensaje, o no es miembro activo del
            servidor, o le falta `VIEW_CHANNEL` o `SEND_MESSAGES`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe, o el mensaje no existe en ese canal o está borrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un mensaje
      description: >
        SCRUM-45. Borra el mensaje para todos. Lo puede borrar su autor, o
        quien tenga `MANAGE_MESSAGES` en el servidor; en los dos casos hace
        falta ser miembro activo con `VIEW_CHANNEL`. Borrar lo propio **no**
        pide `SEND_MESSAGES`: retirar lo que uno dijo tiene que poder
        hacerse siempre.

        El borrado es lógico: `chat` guarda `deletedAt` y `deletedBy` y
        **conserva el contenido** como evidencia de moderación, pero la API
        nunca lo vuelve a devolver. Un mensaje borrado no aparece en el
        historial, y `PATCH` sobre él responde `404`. Sus ids siguen siendo
        anclas válidas de `?before` y `?after` del historial, para que un
        cliente que se desconectó con ese mensaje como último visto pueda
        resincronizar.

        Es idempotente: borrar un mensaje ya borrado responde `204` y no
        publica nada. Si se borró, `chat` publica `chat.message.deleted`
        (frame `message.deleted`, sin contenido).
      operationId: deleteMessage
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: El mensaje quedó borrado (o ya lo estaba).
        '400':
          description: UUID malformado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es el autor y no tiene `MANAGE_MESSAGES`, o no es
            miembro activo del servidor, o le falta `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe, o el mensaje no existe en ese canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/messages/{messageId}/reactions/{emoji}:
    put:
      summary: Reaccionar a un mensaje
      description: >
        SCRUM-49, CA1 y CA3. Agrega la reacción del usuario con ese emoji. Hace
        falta ser miembro activo del servidor con `VIEW_CHANNEL` y
        `ADD_REACTIONS` (`1 << 11`, en el rol por defecto). Un servidor
        suspendido rechaza las reacciones nuevas igual que los mensajes
        nuevos (nota ¹³ de `eventos.md`).

        El toggle del CA2 lo resuelve el cliente: manda `PUT` si el usuario
        todavía no reaccionó con ese emoji y `DELETE` si ya lo hizo. Del
        lado del servidor los dos son idempotentes, así que un doble click o
        un reintento no duplican nada.

        Orden de las validaciones: `X-User-Id` y UUID (401/400), canal (404),
        membresía y permisos (403), emoji (400) y, en la misma escritura, que
        el mensaje exista en el canal y no esté borrado (404) y que no supere
        el límite de 20 emojis distintos (409). Así un 403 por permisos nunca
        depende del emoji.

        Si el usuario ya había reaccionado con ese emoji, responde `200` con
        el estado vigente, **sin** subir `reactionsVersion` y **sin**
        publicar nada. Si cambió, `chat` publica
        `chat.message.reactions-updated` y los miembros del canal reciben el
        frame `message.reactions`, incluido quien reaccionó.
      operationId: addReaction
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/Emoji'
      responses:
        '200':
          description: Las reacciones del mensaje después del pedido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MessageReactions'
        '400':
          description: UUID malformado, o `emoji` no es un único emoji Unicode de hasta 32 bytes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es miembro activo del servidor, le falta
            `VIEW_CHANNEL` o `ADD_REACTIONS`, o el servidor está suspendido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe, o el mensaje no existe en ese canal o está borrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            El mensaje ya tiene reacciones con 20 emojis distintos y este es
            uno nuevo. Sumarse a un emoji que ya está sigue funcionando.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Quitar la reacción propia
      description: >
        SCRUM-49, CA2. Quita la reacción del usuario con ese emoji. Solo
        quita la propia: no hay forma de borrar la reacción de otro. Hace
        falta ser miembro activo con `VIEW_CHANNEL`, pero **no**
        `ADD_REACTIONS`: igual que borrar un mensaje propio (SCRUM-45),
        retirar lo que uno puso tiene que poder hacerse siempre, aunque le
        hayan sacado el permiso o el servidor esté suspendido.

        Mismo orden de validaciones que el `PUT`, sin el 409. Si el usuario no
        tenía esa reacción, responde `200` con el estado vigente, sin subir
        `reactionsVersion` y sin publicar nada. Si quitó la última reacción
        de un emoji, el emoji sale de la lista.
      operationId: removeReaction
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/Emoji'
      responses:
        '200':
          description: Las reacciones del mensaje después del pedido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MessageReactions'
        '400':
          description: UUID malformado, o `emoji` no es un único emoji Unicode de hasta 32 bytes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor, o le falta `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe, o el mensaje no existe en ese canal o está borrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/ws:
    get:
      summary: WebSocket upgrade endpoint for a channel
      description: >
        Not a regular REST endpoint. This fixed path performs an HTTP Upgrade
        to a WebSocket connection scoped to the given channel. Clients send
        SendOrEditMessageEvent payloads to create messages (la edición y el
        borrado van por HTTP, `PATCH` y `DELETE` de
        `/channels/{channelId}/messages/{messageId}`), and receive every
        Message broadcast to this channel. El handshake de upgrade requiere
        X-User-Id/X-User-Role, propagados por el API Gateway a partir de un
        JWT ya validado, y se autoriza contra los permisos del usuario en
        ese canal (RNF — Autorización para unirse a un canal). La
        propagación entre instancias del servicio se hace vía Pub/Sub (RNF
        — Mensajería en tiempo real).


        Códigos de cierre propios (rango privado 4000-4999 de RFC 6455).
        Regla general: los códigos 4400-4499 son terminales y el cliente
        (`@discordia/realtime`) NO reconecta ante ellos; con cualquier otro
        código sigue reconectando con backoff, como hasta ahora.

        - `4403` (reason `account_suspended`): la cuenta fue suspendida por
          el staff (`identity.user.suspended`). El cliente no reconecta,
          descarta los tokens y lleva al login con el aviso de cuenta
          suspendida.


        Frames que `chat` envía por esta conexión además de los mensajes:
        `VoiceParticipantsUpdatedFrame` (`voice-participants.updated`,
        SCRUM-54), cuando cambia quién está conectado a un canal de voz;
        `MessageUpdatedFrame` (`message.updated`, SCRUM-44), cuando se edita
        un mensaje; y `MessageDeletedFrame` (`message.deleted`, SCRUM-45),
        cuando se borra uno; `MentionFrame` (`mention`, SCRUM-47), a cada
        usuario mencionado en un mensaje nuevo; y
        `NotificationSettingsUpdatedFrame` (`notification-settings.updated`,
        SCRUM-78), a las sesiones del propio usuario cuando cambia una de sus
        preferencias de notificación.


        Menciones al enviar (SCRUM-47): el cliente escribe las marcas dentro
        del `content` (`<@userId>`, `<@&roleId>` y `@everyone`, ver
        `Mentions`) y `chat` las resuelve al guardar el mensaje. El
        `message.created` y el ack de `message.send` traen el `mentions` ya
        resuelto. Una marca que no se resuelve no es un error: queda como
        texto. Más de 20 usuarios o más de 5 roles distintos en un mismo
        mensaje rechazan el envío con el código de error
        `TOO_MANY_MENTIONS`.
      operationId: channelWebSocket
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: Switching Protocols. The connection was upgraded to WebSocket successfully.
        '403':
          description: El usuario no tiene permiso de conexión sobre este canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/voice-tokens:
    post:
      summary: Emitir un token para unirse a un canal de voz
      description: >
        SCRUM-51. Valida contra la proyección local que el canal exista, que
        el usuario sea miembro activo del servidor con `VIEW_CHANNEL` y
        `CONNECT` en el servidor, y que el canal sea de voz, en ese orden
        (404, 403, 422). Si pasa, firma un token de LiveKit de
        vida corta que solo permite publicar el micrófono en la sala del
        canal (ADR-0005). Sin body. Si el usuario tenía otra sala firmada,
        `chat` lo saca de ella con el motivo `other_device`
        (ver VoiceDisconnectReason).
      operationId: createVoiceToken
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/VoiceToken'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es miembro activo del servidor del canal, o le falta
            `VIEW_CHANNEL` o `CONNECT` en el servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe o fue borrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: El canal existe pero no es de voz.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La voz no está configurada en este entorno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/unread:
    get:
      summary: Estado de no leídos del usuario en todos sus canales
      description: >
        SCRUM-75. Devuelve un elemento por cada canal de texto no borrado, de
        un servidor donde el usuario es miembro activo con `VIEW_CHANNEL`, que
        tenga al menos un mensaje. El indicador por servidor (CA2) lo arma el
        cliente: un servidor es no leído si alguno de sus canales lo es.
        Un canal sin estado de lectura cuenta como no leído si su último
        mensaje es de otro usuario. Un canal donde el último mensaje es del
        propio usuario nunca es no leído.

        Menciones y preferencias (SCRUM-47, 77 y 78): cada canal trae
        `mentionCount`, cuántos mensajes sin leer mencionan al usuario, y
        `notificationLevel`, el nivel de aviso que rige en ese canal ya
        resuelto entre el canal, el servidor y el silencio (ver
        `NotificationSetting`). Lo que se destaca lo decide el cliente con
        esos dos campos y `unread` (ver `NotificationLevel`). Un canal
        silenciado sigue trayendo `unread` y `mentionCount` reales: silenciar
        no marca nada como leído (CA1 de SCRUM-77).
      operationId: getUnread
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Estado de lectura de cada canal visible con mensajes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelUnread'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/read:
    put:
      summary: Marcar un canal como leído hasta un mensaje
      description: >
        SCRUM-76, CA1. Adelanta el estado de lectura del usuario en el canal
        hasta `messageId`. El estado solo avanza: si el usuario ya había leído
        un mensaje igual o posterior, no cambia nada y la respuesta trae el
        estado vigente, que puede ser más nuevo que el pedido (es la respuesta
        a un reenvío o a dos pestañas que marcan a la vez, no un error). Si el
        estado cambió, `chat` publica `chat.read-state.updated` para
        sincronizar las otras sesiones del usuario.
      operationId: markChannelRead
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId:
                  type: string
                  format: uuid
                  description: Último mensaje que el usuario vio. Tiene que ser de este canal.
      responses:
        '200':
          description: Estado de lectura vigente del canal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReadState'
        '400':
          description: El body no es JSON o `messageId` no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es miembro activo del servidor del canal, o le falta
            `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe o fue borrado, o el mensaje no existe en ese canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/read-all:
    put:
      summary: Marcar como leídos todos los canales del usuario
      description: >
        SCRUM-76, CA2. Adelanta el estado de lectura de todos los canales
        visibles del usuario hasta su último mensaje. Es global: no hay una
        variante por servidor. Sin body. Es idempotente: si ya no queda nada
        sin leer, responde `data: []` y no publica nada.
      operationId: markAllRead
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Los estados que cambiaron, uno por canal que avanzó.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReadState'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/notification-settings:
    get:
      summary: Preferencias de notificación del usuario
      description: >
        SCRUM-78 y SCRUM-77. Devuelve solo los ajustes que el usuario guardó,
        de servidores donde sigue siendo miembro activo. Un canal o un
        servidor que no aparece usa el valor por defecto: nivel heredado y
        sin silenciar.
      operationId: listNotificationSettings
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Los ajustes guardados, en cualquier orden.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSetting'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/notification-settings/servers/{serverId}:
    put:
      summary: Guardar la preferencia de un servidor
      description: >
        SCRUM-78 (CA1) y SCRUM-77 (CA2 y CA3). Reemplaza el ajuste del
        usuario para el servidor: el body lleva los dos campos siempre.
        Silenciar es `muted: true` y reactivar es `muted: false`, sin tocar
        `level`. Es idempotente: guardar lo mismo responde `200` y no
        publica nada. Si cambió, `chat` publica
        `chat.notification-settings.updated` para las otras sesiones del
        usuario.
      operationId: putServerNotificationSetting
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingRequest'
      responses:
        '200':
          description: El ajuste guardado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '400':
          description: >
            `serverId` no es un UUID, el body no es JSON, falta un campo o
            `level` no es uno de los valores permitidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Volver al valor por defecto en un servidor
      description: >
        Borra el ajuste del servidor: vuelve al nivel por defecto y sin
        silenciar. No toca los ajustes de los canales del servidor. Es
        idempotente: si no había ajuste, responde `204` y no publica nada.
      operationId: deleteServerNotificationSetting
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: El servidor usa el valor por defecto.
        '400':
          description: '`serverId` no es un UUID.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/notification-settings/channels/{channelId}:
    put:
      summary: Guardar la preferencia de un canal
      description: >
        SCRUM-78 (CA1 y CA2) y SCRUM-77 (CA1 y CA3). Igual que el del
        servidor, para un canal de texto donde el usuario tiene
        `VIEW_CHANNEL`. El ajuste del canal gana sobre el del servidor,
        salvo el silencio del servidor, que apaga todos sus canales (ver
        `NotificationSetting`).
      operationId: putChannelNotificationSetting
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingRequest'
      responses:
        '200':
          description: El ajuste guardado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSetting'
        '400':
          description: >
            `channelId` no es un UUID, el canal no es de texto, el body no es
            JSON, falta un campo o `level` no es uno de los valores
            permitidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es miembro activo del servidor del canal, o le falta
            `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe o fue borrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Volver a heredar del servidor en un canal
      description: >
        Borra el ajuste del canal: vuelve a regir el del servidor. Es
        idempotente: si no había ajuste, responde `204` y no publica nada.
        No pide `VIEW_CHANNEL`, para que quien perdió el acceso pueda limpiar
        lo que guardó.
      operationId: deleteChannelNotificationSetting
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: El canal hereda la preferencia del servidor.
        '400':
          description: '`channelId` no es un UUID.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/livekit:
    post:
      summary: Recibir los avisos de LiveKit sobre las salas de voz
      description: >
        SCRUM-54. Lo llama LiveKit, no un cliente: no lleva `X-User-Id`. Se
        autentica por firma, no por JWT de sesión: el header `Authorization`
        trae el JWT que LiveKit firma con el secret de `LIVEKIT_API_SECRET`
        (sin el prefijo `Bearer`) e incluye el sha256 del body, así que
        prueba que el aviso lo mandó LiveKit y que nadie tocó el cuerpo. Por
        eso nada entre LiveKit y `chat` puede modificar el body.


        El webhook solo dispara: ante `participant_joined`,
        `participant_left`, `participant_connection_aborted` o
        `room_finished`, `chat` no aplica el evento sino que relee la sala
        entera con `ListParticipants` y guarda esa foto, de modo que un aviso
        perdido o repetido se corrige con el siguiente. Cualquier otro
        evento (`track_*`, `room_started`, etc.) se responde `200` sin
        hacer nada, igual que el de una sala que no es un canal de voz
        conocido.


        Si la relectura, el guardado o la publicación de
        `chat.voice.participants-changed` fallan, responde `500` para que
        LiveKit reintente. Solo existe si la voz está configurada en el
        entorno.
      operationId: receiveLiveKitWebhook
      security:
        - livekitSignature: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              $ref: '#/components/schemas/LiveKitWebhookEvent'
      responses:
        '200':
          description: Aviso procesado, o ignorado porque no interesa.
        '401':
          description: Falta el header `Authorization`, o la firma no es válida o no coincide con el body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falló LiveKit, la base o la publicación al bus. LiveKit reintenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/voice-participants:
    get:
      summary: Listar quién está conectado a los canales de voz de un servidor
      description: >
        SCRUM-54. Foto inicial al abrir un servidor, y relectura al
        reconectar el WebSocket o volver a la app (ADR-0017): los frames que
        se perdieron con el socket caído no se reenvían. Valida contra la
        proyección local que el usuario sea miembro activo del servidor con
        `VIEW_CHANNEL` (403 si no). Devuelve solo las salas que tienen gente;
        un canal ausente de la lista está vacío. Si la voz no está
        configurada en el entorno responde `200` con `data: []`. Cada sala
        trae su `syncedAt`, con el que el cliente descarta fotos más viejas
        que la que ya tiene.
      operationId: getServerVoiceParticipants
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Salas del servidor con al menos un participante.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoiceRoomParticipants'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor, o le falta `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    livekitSignature:
      type: apiKey
      in: header
      name: Authorization
      description: >
        JWT firmado por LiveKit con el secret de `LIVEKIT_API_SECRET`, sin
        prefijo `Bearer`, con el sha256 del body. Lo valida `chat`; es la
        única autenticación de `POST /webhooks/livekit`.

  parameters:
    ServerId:
      in: path
      name: serverId
      required: true
      schema:
        type: string
        format: uuid
      description: Debe referenciar un Server existente en `community`.
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Id del usuario autenticado, propagado por el API Gateway a partir
        del JWT ya validado (ver JwtClaims en identity.yaml). Usado tanto
        para autorizar el historial de mensajes como para el handshake de
        upgrade a WebSocket; el gateway valida el JWT antes de completar el
        upgrade (RNF — Autorización para unirse a un canal).
    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        type: string
        enum: [user, staff]
      description: Rol global del usuario autenticado, propagado por el API Gateway.
    ChannelId:
      in: path
      name: channelId
      required: true
      schema:
        type: string
        format: uuid
      description: Debe referenciar un Channel existente en `community`.
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        type: string
        format: uuid
      description: Mensaje del canal indicado en `channelId`.
    Emoji:
      in: path
      name: emoji
      required: true
      schema:
        type: string
        maxLength: 32
      example: "%F0%9F%91%8D"
      description: >
        SCRUM-49. Un único emoji Unicode, codificado en UTF-8 y con
        percent-encoding en el path (`👍` viaja como `%F0%9F%91%8D`). Vale
        un emoji con sus variantes: tono de piel, secuencias ZWJ, banderas y
        keycaps. Tiene que ser un solo grafema y ocupar hasta 32 bytes. Un
        texto común, varios emojis juntos o un emoji personalizado responden
        `400`.

  schemas:
    Message:
      type: object
      required: [messageId, channelId, serverId, authorId, content, createdAt, editedAt, clientMessageId, reactions, reactionsVersion, mentions]
      properties:
        messageId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
          description: Referencia a User.id en `identity`. El cliente resuelve nombre/avatar vía identity.
        content:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Momento de la última edición, en UTC y con precisión de
            milisegundos, o `null` si nunca se editó (SCRUM-44). No hay
            historial de ediciones: solo se guarda la última versión. El
            cliente aplica una edición recibida solo si su `editedAt` es más
            nuevo que el que ya tiene, comparado como instante. `message.created`
            y el ack de `message.send` no cambian de forma.
        clientMessageId:
          type: string
          format: uuid
          description: ID generado por el cliente al enviar. Permite deduplicar mensajes recibidos por WebSocket y por HTTP al reconectar.
        reactions:
          type: array
          description: >
            Reacciones del mensaje (SCRUM-49), una entrada por emoji, en el
            orden en que cada emoji se agregó por primera vez. Un emoji sin
            usuarios no aparece. Es una lista vacía si el mensaje no tiene
            reacciones, incluidos los mensajes guardados antes de SCRUM-49.
            `message.created` y el ack de `message.send` no cambian de forma:
            un mensaje recién enviado no tiene reacciones.
          maxItems: 20
          items:
            $ref: '#/components/schemas/Reaction'
        reactionsVersion:
          type: integer
          minimum: 0
          description: >
            Contador que sube en 1 con cada cambio de `reactions` del mensaje,
            y `0` si nunca tuvo. El cliente aplica un `message.reactions`
            solo si su `reactionsVersion` es mayor que el que ya tiene para
            ese mensaje: así un frame repetido o que llega fuera de orden no
            retrocede las reacciones.
        mentions:
          $ref: '#/components/schemas/Mentions'

    Mentions:
      type: object
      description: |
        Menciones del mensaje (SCRUM-47), resueltas por `chat` al enviar o al
        editar. El cliente escribe las marcas dentro del `content`, que se
        guarda tal cual:

        - `<@userId>`: un usuario. Entra en `userIds` si es miembro activo
          del servidor con `VIEW_CHANNEL`.
        - `<@&roleId>`: un rol. Entra en `roleIds` solo si el autor tiene
          `MENTION_EVERYONE` (`1 << 12`). Avisa a los miembros que tienen ese
          rol y `VIEW_CHANNEL` (CA2).
        - `@everyone`: todo el canal. Pone `everyone` en `true` solo si el
          autor tiene `MENTION_EVERYONE` (CA3). Avisa a los miembros con
          `VIEW_CHANNEL`.

        Una marca que no cumple su regla queda como texto en el `content` y
        no aparece acá: así se resuelve el CA4. El autor nunca se avisa a sí
        mismo, aunque se mencione o tenga el rol mencionado. Un mensaje
        anterior a SCRUM-47 trae las dos listas vacías y `everyone` en
        `false`.
      required: [userIds, roleIds, everyone]
      properties:
        userIds:
          type: array
          maxItems: 20
          description: Usuarios mencionados, sin repetidos, en el orden en que aparecen.
          items:
            type: string
            format: uuid
        roleIds:
          type: array
          maxItems: 5
          description: Roles mencionados, sin repetidos, en el orden en que aparecen.
          items:
            type: string
            format: uuid
        everyone:
          type: boolean

    MentionFrame:
      type: object
      description: >
        Frame (SCRUM-47) que `chat` envía por el WebSocket de chat al usuario
        mencionado en un mensaje nuevo: es la "notificación destacada" en
        vivo. Nace del evento `chat.message.sent`. Si la mención es directa
        o por un rol, va solo a esos usuarios (`SendToUser`). Si es
        `@everyone`, va a los miembros con `VIEW_CHANNEL`
        (`Broadcast(serverId)`). Nunca se manda por una edición.

        El cliente lo ignora si `authorId` es el propio usuario, y cuenta
        `messageId` distintos, así que un frame repetido no suma dos veces.
        Si el canal está abierto en pantalla, lo marca leído como cualquier
        mensaje. Si no, suma uno al `mentionCount` local del canal, y si el
        `notificationLevel` del canal no es `none`, avisa en la app.
      required: [type, messageId, channelId, serverId, authorId, createdAt]
      properties:
        type:
          type: string
          enum: [mention]
        messageId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Reaction:
      type: object
      description: >
        Un emoji y quiénes reaccionaron con él (SCRUM-49). El cliente cuenta
        las reacciones con `userIds.length` y resalta la propia si su
        `userId` está en la lista.
      required: [emoji, userIds]
      properties:
        emoji:
          type: string
          maxLength: 32
          description: >
            Un emoji Unicode, tal como lo eligió el usuario (ver el parámetro
            `Emoji`).
          example: "👍"
        userIds:
          type: array
          minItems: 1
          description: Referencias a User.id en `identity`, en el orden en que reaccionaron. Sin repetidos.
          items:
            type: string
            format: uuid

    MessageReactionsFrame:
      type: object
      description: >
        Frame (SCRUM-49) que `chat` envía por el WebSocket de chat cuando
        cambian las reacciones de un mensaje. Se entrega con
        `Broadcast(serverId)`, solo a los miembros con `VIEW_CHANNEL`,
        incluido quien reaccionó. Lleva la lista **completa** de reacciones y
        no un delta, y no es un `invalidate`, porque el mensaje es de `chat`
        (ADR-0017). Nace del evento `chat.message.reactions-updated`. Si el
        cliente no tiene el mensaje cargado, lo ignora.
      required: [type, messageId, channelId, serverId, reactions, reactionsVersion]
      properties:
        type:
          type: string
          enum: [message.reactions]
        messageId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        reactions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Reaction'
        reactionsVersion:
          type: integer
          minimum: 1
          description: Misma regla que en `Message.reactionsVersion`.

    MessageReactions:
      type: object
      description: >
        Respuesta del `PUT` y del `DELETE` de una reacción: el estado de las
        reacciones del mensaje después del pedido, con la misma forma que el
        frame `message.reactions`. Le permite al cliente que reaccionó
        confirmar su cambio sin esperar el frame.
      required: [messageId, reactions, reactionsVersion]
      properties:
        messageId:
          type: string
          format: uuid
        reactions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Reaction'
        reactionsVersion:
          type: integer
          minimum: 0

    SendOrEditMessageEvent:
      type: object
      description: >
        Payload sent by a client over the WebSocket to create a message. En
        el Sprint 1 solo se soporta creación (`id` ausente); edición se
        agrega junto con la historia optativa correspondiente sin romper
        este contrato.
      required: [content]
      properties:
        id:
          type: string
          format: uuid
          description: Presente solo al editar un mensaje existente (fuera de alcance del Sprint 1).
        content:
          type: string
          minLength: 1
          maxLength: 2000

    MessageUpdatedFrame:
      type: object
      description: >
        Frame (SCRUM-44) que `chat` envía por el WebSocket de chat cuando se
        edita un mensaje. Se entrega con `Broadcast(serverId)`, solo a los
        miembros con `VIEW_CHANNEL`. Lleva los datos y no es un `invalidate`,
        porque el mensaje es de `chat` (ADR-0017). Nace del evento
        `chat.message.updated`.
      required: [type, messageId, channelId, serverId, authorId, content, editedAt, mentions]
      properties:
        type:
          type: string
          enum: [message.updated]
        messageId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 2000
        editedAt:
          type: string
          format: date-time
          description: Misma regla que en `Message.editedAt`.
        mentions:
          $ref: '#/components/schemas/Mentions'

    MessageDeletedFrame:
      type: object
      description: >
        Frame (SCRUM-45) que `chat` envía por el WebSocket de chat cuando se
        borra un mensaje. **No lleva contenido.** Se entrega con
        `Broadcast(serverId)`. Nace del evento `chat.message.deleted`. El
        cliente saca el mensaje de lo que muestra; si no lo tenía cargado,
        lo ignora.
      required: [type, messageId, channelId, serverId, deletedAt]
      properties:
        type:
          type: string
          enum: [message.deleted]
        messageId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        deletedAt:
          type: string
          format: date-time

    VoiceToken:
      type: object
      description: Credencial para conectarse a la sala de LiveKit del canal de voz (ADR-0005).
      required: [token, url, roomName, expiresAt]
      properties:
        token:
          type: string
          description: JWT de acceso firmado para LiveKit. Solo permite publicar el micrófono.
        url:
          type: string
          description: URL `wss://` de LiveKit a la que se conecta el cliente.
        roomName:
          type: string
          description: Nombre de la sala; es igual al `channelId`.
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento del token, en UTC. Solo limita la conexión inicial; una llamada ya conectada no se corta al vencer.

    VoiceDisconnectReason:
      type: string
      description: >
        Motivo de una salida forzada de un canal de voz. No viaja por HTTP:
        antes de sacar al participante, `chat` lo escribe en el atributo
        `disconnectReason` del participante de LiveKit, y el cliente lo lee
        de su participante local al recibir la desconexión. Si el atributo
        no está, el cliente muestra un texto genérico según el motivo de
        desconexión de LiveKit. `channel_deleted` no se escribe como
        atributo: el cliente lo deduce porque LiveKit informa que la sala se
        borró (ROOM_DELETED).
      enum:
        - other_device
        - left_server
        - kicked
        - banned
        - suspended
        - permissions_revoked
        - channel_deleted

    ReadState:
      type: object
      required: [channelId, serverId, lastReadMessageId, lastReadAt]
      description: >
        Hasta qué mensaje leyó el usuario un canal. Es lo que viaja en las
        respuestas de los `PUT`, en `chat.read-state.updated` y en el frame
        `read-state.updated`.
      properties:
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        lastReadMessageId:
          type: string
          format: uuid
        lastReadAt:
          type: string
          format: date-time
          description: >
            `createdAt` del mensaje `lastReadMessageId`, no la hora en que se
            marcó. Junto con el id es la tupla que ordena los avances.

    ChannelUnread:
      type: object
      required: [channelId, serverId, lastMessageId, lastMessageAt, lastReadMessageId, lastReadAt, unread, mentionCount, notificationLevel]
      properties:
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        lastMessageId:
          type: string
          format: uuid
          description: Último mensaje del canal.
        lastMessageAt:
          type: string
          format: date-time
          description: >
            `createdAt` de `lastMessageId`. Junto con el id ordena este mensaje
            contra un `ReadState`: los id son UUID v4 y no se pueden comparar
            solos. Las fechas se comparan como instantes y no como texto, porque
            los decimales finales en cero se omiten.
        lastReadMessageId:
          type: string
          format: uuid
          nullable: true
          description: Último mensaje leído, o `null` si el usuario nunca marcó el canal.
        lastReadAt:
          type: string
          format: date-time
          nullable: true
          description: >
            `createdAt` de `lastReadMessageId`, no la hora en que se marcó, o
            `null` si el usuario nunca marcó el canal.
        unread:
          type: boolean
          description: >
            `true` si el último mensaje es de otro usuario y es posterior al
            último leído (o no hay ninguno leído).
        mentionCount:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Cuántos mensajes posteriores al último leído mencionan al usuario
            (SCRUM-47, y CA3 de SCRUM-75): directamente, por un rol que tiene
            hoy o con `@everyone`. Cuenta mensajes y no marcas: uno que
            menciona al usuario dos veces suma uno. No cuenta los propios ni
            los borrados. Si el usuario nunca marcó el canal, cuenta desde
            que entró al servidor, así un `@everyone` viejo no le llega al
            que acaba de entrar. Se cuenta hasta 100, y el cliente muestra
            "99+".
        notificationLevel:
          $ref: '#/components/schemas/NotificationLevel'

    NotificationLevel:
      type: string
      enum: [all, mentions, none]
      description: |
        Qué genera una notificación destacada en un canal (SCRUM-78):
        `all`, cualquier mensaje nuevo de otro usuario; `mentions`, solo las
        menciones al usuario; `none`, nada. El valor por defecto es
        `mentions`. Con ningún nivel un mensaje deja de contar como no leído.

        La regla de qué se destaca vive en una sola función de
        `@discordia/core`, que usan web y mobile:

        - `none`: nada se destaca y no hay aviso en la app.
        - `mentions`: se destaca si `mentionCount > 0`, y avisa con cada
          frame `mention`.
        - `all`: se destaca si `unread` o `mentionCount > 0`, y avisa con
          cada `message.created` de otro usuario y con cada `mention`.

    NotificationSetting:
      type: object
      description: |
        Ajuste de notificación del usuario para un servidor o un canal
        (SCRUM-77 y SCRUM-78). `chat` resuelve el nivel de un canal así, y lo
        devuelve ya resuelto en `ChannelUnread.notificationLevel`:

        1. Si el servidor o el canal están silenciados (`muted`), `none`.
        2. Si no, el `level` del canal; si es `null`, el del servidor; si
           también es `null`, `mentions`.

        El silencio va aparte del nivel porque los dos CA lo piden: silenciar
        el servidor apaga **todos** sus canales, aunque alguno tenga un nivel
        propio (CA2 de SCRUM-77), mientras que entre niveles gana el del
        canal (CA2 de SCRUM-78). Y reactivar devuelve el nivel que el usuario
        había elegido, en vez de borrarlo (CA3 de SCRUM-77).
      required: [scopeType, scopeId, serverId, level, muted, updatedAt]
      properties:
        scopeType:
          type: string
          enum: [server, channel]
        scopeId:
          type: string
          format: uuid
          description: El `serverId` o el `channelId`, según `scopeType`.
        serverId:
          type: string
          format: uuid
          description: El servidor del ajuste. Si `scopeType` es `server`, es igual a `scopeId`.
        level:
          allOf:
            - $ref: '#/components/schemas/NotificationLevel'
          nullable: true
          description: '`null` hereda: el canal, del servidor; el servidor, el valor por defecto.'
        muted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          description: >
            Cuándo se guardó. Ordena los cambios: el cliente aplica un
            `notification-settings.updated` solo si su `updatedAt` es más
            nuevo que el que ya tiene para ese alcance.

    NotificationSettingRequest:
      type: object
      description: Body del `PUT` de un ajuste. Lleva los dos campos siempre.
      required: [level, muted]
      properties:
        level:
          allOf:
            - $ref: '#/components/schemas/NotificationLevel'
          nullable: true
        muted:
          type: boolean

    NotificationSettingsUpdatedFrame:
      type: object
      description: >
        Frame (SCRUM-78) que `chat` envía a todas las sesiones del usuario
        cuando cambia uno de sus ajustes, como `read-state.updated`. Nace de
        `chat.notification-settings.updated`. Un `DELETE` llega como un
        ajuste con `level: null` y `muted: false`, que equivale al valor por
        defecto. El cliente actualiza su lista de ajustes y vuelve a pedir
        `GET /users/me/unread`, que trae el `notificationLevel` resuelto.
      required: [type, setting]
      properties:
        type:
          type: string
          enum: [notification-settings.updated]
        setting:
          $ref: '#/components/schemas/NotificationSetting'

    VoiceParticipant:
      type: object
      description: Un usuario conectado a la sala de voz de un canal.
      required: [userId, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: >
            Referencia a User.id en `identity`. Es la identidad del
            participante en LiveKit. El cliente resuelve nombre y avatar vía
            `identity`. No incluye mute ni "está hablando": son estados de la
            llamada y se ven estando adentro.
        joinedAt:
          type: string
          format: date-time
          description: Momento en que el participante se unió a la sala, según LiveKit, en UTC.

    VoiceRoomParticipants:
      type: object
      description: Quién está conectado a la sala de voz de un canal, según la última foto que `chat` guardó.
      required: [channelId, participants, syncedAt]
      properties:
        channelId:
          type: string
          format: uuid
          description: Canal de voz; es igual al nombre de la sala de LiveKit.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/VoiceParticipant'
          description: Ordenados por `joinedAt`.
        syncedAt:
          type: string
          format: date-time
          description: >
            Hora, en UTC, tomada **antes** de leer la sala a LiveKit. El
            cliente aplica una foto solo si su `syncedAt` es mayor que el que
            ya tiene para ese canal.

    VoiceParticipantsUpdatedFrame:
      type: object
      description: >
        Frame (SCRUM-54, ADR-0017) que `chat` envía por el WebSocket de chat
        (`/channels/{channelId}/ws`) cuando cambia quién está conectado a un
        canal de voz. Se entrega con `Broadcast(serverId)` a las conexiones
        suscriptas a ese servidor (ADR-0011), y lleva la lista completa y no
        un delta. Un `participants` vacío significa que el canal quedó vacío.
        Nace del evento `chat.voice.participants-changed`.
      required: [type, serverId, channelId, participants, syncedAt]
      properties:
        type:
          type: string
          enum: [voice-participants.updated]
        serverId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        participants:
          type: array
          items:
            $ref: '#/components/schemas/VoiceParticipant'
        syncedAt:
          type: string
          format: date-time
          description: Misma regla que en `VoiceRoomParticipants`.

    LiveKitWebhookEvent:
      type: object
      description: >
        Aviso de LiveKit (solo los campos que `chat` lee; el resto se
        ignora). `chat` no usa el contenido para saber quién está en la sala:
        solo el nombre de la sala y el tipo de evento.
      required: [event]
      properties:
        id:
          type: string
          description: Id del aviso; `chat` lo loguea.
        event:
          type: string
          description: >
            Tipo de evento. Disparan la relectura de la sala:
            `participant_joined`, `participant_left`,
            `participant_connection_aborted` y `room_finished`.
        room:
          type: object
          properties:
            name:
              type: string
              description: Nombre de la sala; es igual al `channelId`.

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string