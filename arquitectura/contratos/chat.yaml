openapi: 3.0.0
info:
  title: Discordia Chat Service API
  version: 1.0.0
  description: >
    Servicio `chat-y-real-time`. Cubre el camino crítico del Sprint 1
    (CP1): Enviar mensaje en un canal (#15); y del Sprint 2 (CP2): Historial
    y reconexión sin pérdida de mensajes (SCRUM-46) — paginación con cursor
    (`before`/`after`) y garantía de no pérdida al reconectar.
    Adaptado del contrato de referencia entregado por la cátedra: IDs pasan
    de integer a UUID para ser consistentes con `identity` y `community`, y
    channelId/authorId ahora referencian directamente los recursos de esos
    servicios (Channel.id de `community`, User.id de `identity`).

servers:
  - url: http://localhost:8003
    description: Entorno local (detrás del API Gateway en producción)

paths:
  /channels/{channelId}/messages:
    get:
      summary: Retrieve the message history of a channel
      description: >
        Returns the channel's messages in ascending order (oldest first).
        Without params: returns the last 50 messages (initial load, CA1).
        ?before: scroll-up pagination. ?after: reconnection resync (CA2) —
        returns 404 if the anchor does not exist in this channel.
      operationId: getChannelMessages
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
          description: Debe referenciar un Channel existente en `community`.
        - in: query
          name: before
          required: false
          schema:
            type: string
            format: uuid
          description: Id de mensaje para paginar hacia atrás (mensajes anteriores a este).
        - in: query
          name: after
          required: false
          schema:
            type: string
            format: uuid
          description: Id de mensaje para resync al reconectar (mensajes posteriores a este). Devuelve 404 si el anchor no existe en el canal.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A list of messages
          content:
            application/json:
              schema:
                type: object
                required: [data, hasMore]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  hasMore:
                    type: boolean
                    description: >
                      true cuando hay más mensajes disponibles más allá de la página devuelta.
                      Para ?after, true indica que el cliente debe seguir paginando para ponerse al día.
        '400':
          description: Parámetros inválidos (UUID malformado, limit no positivo, limit > 100, before y after simultáneos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: X-User-Id ausente o no es un UUID válido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor dueño del canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente, o el anchor de ?after/?before no existe en este canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/ws:
    get:
      summary: WebSocket upgrade endpoint for a channel
      description: >
        Not a regular REST endpoint. This fixed path performs an HTTP Upgrade
        to a WebSocket connection scoped to the given channel. Clients send
        SendOrEditMessageEvent payloads to create messages (edición de
        mensaje es optativa y no está en el Sprint 1), and receive every
        Message broadcast to this channel. El handshake de upgrade requiere
        X-User-Id/X-User-Role, propagados por el API Gateway a partir de un
        JWT ya validado, y se autoriza contra los permisos del usuario en
        ese canal (RNF — Autorización para unirse a un canal). La
        propagación entre instancias del servicio se hace vía Pub/Sub (RNF
        — Mensajería en tiempo real).


        Códigos de cierre propios (rango privado 4000-4999 de RFC 6455).
        Regla general: los códigos 4400-4499 son terminales y el cliente
        (`@discordia/realtime`) NO reconecta ante ellos; con cualquier otro
        código sigue reconectando con backoff, como hasta ahora.

        - `4403` (reason `account_suspended`): la cuenta fue suspendida por
          el staff (`identity.user.suspended`). El cliente no reconecta,
          descarta los tokens y lleva al login con el aviso de cuenta
          suspendida.


        Frames que `chat` envía por esta conexión además de los mensajes:
        `VoiceParticipantsUpdatedFrame` (`voice-participants.updated`,
        SCRUM-54), cuando cambia quién está conectado a un canal de voz.
      operationId: channelWebSocket
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: Switching Protocols. The connection was upgraded to WebSocket successfully.
        '403':
          description: El usuario no tiene permiso de conexión sobre este canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/voice-tokens:
    post:
      summary: Emitir un token para unirse a un canal de voz
      description: >
        SCRUM-51. Valida contra la proyección local que el canal exista, que
        el usuario sea miembro activo del servidor con `VIEW_CHANNEL` y
        `CONNECT` en el servidor, y que el canal sea de voz, en ese orden
        (404, 403, 422). Si pasa, firma un token de LiveKit de
        vida corta que solo permite publicar el micrófono en la sala del
        canal (ADR-0005). Sin body. Si el usuario tenía otra sala firmada,
        `chat` lo saca de ella con el motivo `other_device`
        (ver VoiceDisconnectReason).
      operationId: createVoiceToken
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/VoiceToken'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es miembro activo del servidor del canal, o le falta
            `VIEW_CHANNEL` o `CONNECT` en el servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe o fue borrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: El canal existe pero no es de voz.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La voz no está configurada en este entorno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/unread:
    get:
      summary: Estado de no leídos del usuario en todos sus canales
      description: >
        SCRUM-75. Devuelve un elemento por cada canal de texto no borrado, de
        un servidor donde el usuario es miembro activo con `VIEW_CHANNEL`, que
        tenga al menos un mensaje. El indicador por servidor (CA2) lo arma el
        cliente: un servidor es no leído si alguno de sus canales lo es.
        Un canal sin estado de lectura cuenta como no leído si su último
        mensaje es de otro usuario. Un canal donde el último mensaje es del
        propio usuario nunca es no leído. `mentionCount` vale siempre `0` hasta
        que exista la optativa "Menciones" (CA3).
      operationId: getUnread
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Estado de lectura de cada canal visible con mensajes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelUnread'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels/{channelId}/read:
    put:
      summary: Marcar un canal como leído hasta un mensaje
      description: >
        SCRUM-76, CA1. Adelanta el estado de lectura del usuario en el canal
        hasta `messageId`. El estado solo avanza: si el usuario ya había leído
        un mensaje igual o posterior, no cambia nada y la respuesta trae el
        estado vigente, que puede ser más nuevo que el pedido (es la respuesta
        a un reenvío o a dos pestañas que marcan a la vez, no un error). Si el
        estado cambió, `chat` publica `chat.read-state.updated` para
        sincronizar las otras sesiones del usuario.
      operationId: markChannelRead
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId:
                  type: string
                  format: uuid
                  description: Último mensaje que el usuario vio. Tiene que ser de este canal.
      responses:
        '200':
          description: Estado de lectura vigente del canal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReadState'
        '400':
          description: El body no es JSON o `messageId` no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es miembro activo del servidor del canal, o le falta
            `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal no existe o fue borrado, o el mensaje no existe en ese canal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/read-all:
    put:
      summary: Marcar como leídos todos los canales del usuario
      description: >
        SCRUM-76, CA2. Adelanta el estado de lectura de todos los canales
        visibles del usuario hasta su último mensaje. Es global: no hay una
        variante por servidor. Sin body. Es idempotente: si ya no queda nada
        sin leer, responde `data: []` y no publica nada.
      operationId: markAllRead
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Los estados que cambiaron, uno por canal que avanzó.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReadState'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/livekit:
    post:
      summary: Recibir los avisos de LiveKit sobre las salas de voz
      description: >
        SCRUM-54. Lo llama LiveKit, no un cliente: no lleva `X-User-Id`. Se
        autentica por firma, no por JWT de sesión: el header `Authorization`
        trae el JWT que LiveKit firma con el secret de `LIVEKIT_API_SECRET`
        (sin el prefijo `Bearer`) e incluye el sha256 del body, así que
        prueba que el aviso lo mandó LiveKit y que nadie tocó el cuerpo. Por
        eso nada entre LiveKit y `chat` puede modificar el body.


        El webhook solo dispara: ante `participant_joined`,
        `participant_left`, `participant_connection_aborted` o
        `room_finished`, `chat` no aplica el evento sino que relee la sala
        entera con `ListParticipants` y guarda esa foto, de modo que un aviso
        perdido o repetido se corrige con el siguiente. Cualquier otro
        evento (`track_*`, `room_started`, etc.) se responde `200` sin
        hacer nada, igual que el de una sala que no es un canal de voz
        conocido.


        Si la relectura, el guardado o la publicación de
        `chat.voice.participants-changed` fallan, responde `500` para que
        LiveKit reintente. Solo existe si la voz está configurada en el
        entorno.
      operationId: receiveLiveKitWebhook
      security:
        - livekitSignature: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              $ref: '#/components/schemas/LiveKitWebhookEvent'
      responses:
        '200':
          description: Aviso procesado, o ignorado porque no interesa.
        '401':
          description: Falta el header `Authorization`, o la firma no es válida o no coincide con el body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falló LiveKit, la base o la publicación al bus. LiveKit reintenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/voice-participants:
    get:
      summary: Listar quién está conectado a los canales de voz de un servidor
      description: >
        SCRUM-54. Foto inicial al abrir un servidor, y relectura al
        reconectar el WebSocket o volver a la app (ADR-0017): los frames que
        se perdieron con el socket caído no se reenvían. Valida contra la
        proyección local que el usuario sea miembro activo del servidor con
        `VIEW_CHANNEL` (403 si no). Devuelve solo las salas que tienen gente;
        un canal ausente de la lista está vacío. Si la voz no está
        configurada en el entorno responde `200` con `data: []`. Cada sala
        trae su `syncedAt`, con el que el cliente descarta fotos más viejas
        que la que ya tiene.
      operationId: getServerVoiceParticipants
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Salas del servidor con al menos un participante.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoiceRoomParticipants'
        '401':
          description: Falta el header `X-User-Id` o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es miembro activo del servidor, o le falta `VIEW_CHANNEL`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    livekitSignature:
      type: apiKey
      in: header
      name: Authorization
      description: >
        JWT firmado por LiveKit con el secret de `LIVEKIT_API_SECRET`, sin
        prefijo `Bearer`, con el sha256 del body. Lo valida `chat`; es la
        única autenticación de `POST /webhooks/livekit`.

  parameters:
    ServerId:
      in: path
      name: serverId
      required: true
      schema:
        type: string
        format: uuid
      description: Debe referenciar un Server existente en `community`.
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Id del usuario autenticado, propagado por el API Gateway a partir
        del JWT ya validado (ver JwtClaims en identity.yaml). Usado tanto
        para autorizar el historial de mensajes como para el handshake de
        upgrade a WebSocket; el gateway valida el JWT antes de completar el
        upgrade (RNF — Autorización para unirse a un canal).
    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        type: string
        enum: [user, staff]
      description: Rol global del usuario autenticado, propagado por el API Gateway.
    ChannelId:
      in: path
      name: channelId
      required: true
      schema:
        type: string
        format: uuid
      description: Debe referenciar un Channel existente en `community`.

  schemas:
    Message:
      type: object
      required: [messageId, channelId, serverId, authorId, content, createdAt, clientMessageId]
      properties:
        messageId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
          description: Referencia a User.id en `identity`. El cliente resuelve nombre/avatar vía identity.
        content:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        clientMessageId:
          type: string
          format: uuid
          description: ID generado por el cliente al enviar. Permite deduplicar mensajes recibidos por WebSocket y por HTTP al reconectar.

    SendOrEditMessageEvent:
      type: object
      description: >
        Payload sent by a client over the WebSocket to create a message. En
        el Sprint 1 solo se soporta creación (`id` ausente); edición se
        agrega junto con la historia optativa correspondiente sin romper
        este contrato.
      required: [content]
      properties:
        id:
          type: string
          format: uuid
          description: Presente solo al editar un mensaje existente (fuera de alcance del Sprint 1).
        content:
          type: string
          minLength: 1
          maxLength: 2000

    VoiceToken:
      type: object
      description: Credencial para conectarse a la sala de LiveKit del canal de voz (ADR-0005).
      required: [token, url, roomName, expiresAt]
      properties:
        token:
          type: string
          description: JWT de acceso firmado para LiveKit. Solo permite publicar el micrófono.
        url:
          type: string
          description: URL `wss://` de LiveKit a la que se conecta el cliente.
        roomName:
          type: string
          description: Nombre de la sala; es igual al `channelId`.
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento del token, en UTC. Solo limita la conexión inicial; una llamada ya conectada no se corta al vencer.

    VoiceDisconnectReason:
      type: string
      description: >
        Motivo de una salida forzada de un canal de voz. No viaja por HTTP:
        antes de sacar al participante, `chat` lo escribe en el atributo
        `disconnectReason` del participante de LiveKit, y el cliente lo lee
        de su participante local al recibir la desconexión. Si el atributo
        no está, el cliente muestra un texto genérico según el motivo de
        desconexión de LiveKit. `channel_deleted` no se escribe como
        atributo: el cliente lo deduce porque LiveKit informa que la sala se
        borró (ROOM_DELETED).
      enum:
        - other_device
        - left_server
        - kicked
        - banned
        - suspended
        - permissions_revoked
        - channel_deleted

    ReadState:
      type: object
      required: [channelId, serverId, lastReadMessageId, lastReadAt]
      description: >
        Hasta qué mensaje leyó el usuario un canal. Es lo que viaja en las
        respuestas de los `PUT`, en `chat.read-state.updated` y en el frame
        `read-state.updated`.
      properties:
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        lastReadMessageId:
          type: string
          format: uuid
        lastReadAt:
          type: string
          format: date-time
          description: >
            `createdAt` del mensaje `lastReadMessageId`, no la hora en que se
            marcó. Junto con el id es la tupla que ordena los avances.

    ChannelUnread:
      type: object
      required: [channelId, serverId, lastMessageId, lastMessageAt, lastReadMessageId, lastReadAt, unread, mentionCount]
      properties:
        channelId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        lastMessageId:
          type: string
          format: uuid
          description: Último mensaje del canal.
        lastMessageAt:
          type: string
          format: date-time
          description: >
            `createdAt` de `lastMessageId`. Junto con el id ordena este mensaje
            contra un `ReadState`: los id son UUID v4 y no se pueden comparar
            solos. Las fechas se comparan como instantes y no como texto, porque
            los decimales finales en cero se omiten.
        lastReadMessageId:
          type: string
          format: uuid
          nullable: true
          description: Último mensaje leído, o `null` si el usuario nunca marcó el canal.
        lastReadAt:
          type: string
          format: date-time
          nullable: true
          description: >
            `createdAt` de `lastReadMessageId`, no la hora en que se marcó, o
            `null` si el usuario nunca marcó el canal.
        unread:
          type: boolean
          description: >
            `true` si el último mensaje es de otro usuario y es posterior al
            último leído (o no hay ninguno leído).
        mentionCount:
          type: integer
          minimum: 0
          description: Siempre `0` hasta que exista la optativa "Menciones" (CA3 de SCRUM-75).

    VoiceParticipant:
      type: object
      description: Un usuario conectado a la sala de voz de un canal.
      required: [userId, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: >
            Referencia a User.id en `identity`. Es la identidad del
            participante en LiveKit. El cliente resuelve nombre y avatar vía
            `identity`. No incluye mute ni "está hablando": son estados de la
            llamada y se ven estando adentro.
        joinedAt:
          type: string
          format: date-time
          description: Momento en que el participante se unió a la sala, según LiveKit, en UTC.

    VoiceRoomParticipants:
      type: object
      description: Quién está conectado a la sala de voz de un canal, según la última foto que `chat` guardó.
      required: [channelId, participants, syncedAt]
      properties:
        channelId:
          type: string
          format: uuid
          description: Canal de voz; es igual al nombre de la sala de LiveKit.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/VoiceParticipant'
          description: Ordenados por `joinedAt`.
        syncedAt:
          type: string
          format: date-time
          description: >
            Hora, en UTC, tomada **antes** de leer la sala a LiveKit. El
            cliente aplica una foto solo si su `syncedAt` es mayor que el que
            ya tiene para ese canal.

    VoiceParticipantsUpdatedFrame:
      type: object
      description: >
        Frame (SCRUM-54, ADR-0017) que `chat` envía por el WebSocket de chat
        (`/channels/{channelId}/ws`) cuando cambia quién está conectado a un
        canal de voz. Se entrega con `Broadcast(serverId)` a las conexiones
        suscriptas a ese servidor (ADR-0011), y lleva la lista completa y no
        un delta. Un `participants` vacío significa que el canal quedó vacío.
        Nace del evento `chat.voice.participants-changed`.
      required: [type, serverId, channelId, participants, syncedAt]
      properties:
        type:
          type: string
          enum: [voice-participants.updated]
        serverId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        participants:
          type: array
          items:
            $ref: '#/components/schemas/VoiceParticipant'
        syncedAt:
          type: string
          format: date-time
          description: Misma regla que en `VoiceRoomParticipants`.

    LiveKitWebhookEvent:
      type: object
      description: >
        Aviso de LiveKit (solo los campos que `chat` lee; el resto se
        ignora). `chat` no usa el contenido para saber quién está en la sala:
        solo el nombre de la sala y el tipo de evento.
      required: [event]
      properties:
        id:
          type: string
          description: Id del aviso; `chat` lo loguea.
        event:
          type: string
          description: >
            Tipo de evento. Disparan la relectura de la sala:
            `participant_joined`, `participant_left`,
            `participant_connection_aborted` y `room_finished`.
        room:
          type: object
          properties:
            name:
              type: string
              description: Nombre de la sala; es igual al `channelId`.

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string