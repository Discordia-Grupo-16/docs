openapi: 3.0.0
info:
  title: Discordia Identity Service API
  version: 1.0.0
  description: >
    Servicio `identity`. Cubre las épicas Usuarios y Perfil para el camino
    crítico del Sprint 1 (CP1): Registro de usuarios (#1), Login con email y
    contraseña (#2), Edición de perfil (#4) y Visualización de perfil propio (#5).
    Fuera de alcance en este sprint: PIN y perfil público — se agregan en un
    sprint posterior sin romper este contrato.

    Sprint 3 (CP3) suma, en una sola cadena de cambios: recupero de contraseña
    (SCRUM-20, `/password-resets*`), autenticación de dos factores con TOTP
    (SCRUM-23, `/users/me/mfa/*` y `POST /sessions/mfa`) y login con Google
    (SCRUM-21, ideal, `POST /sessions/google`). `POST /sessions` pasa a poder
    responder un desafío de segundo factor en lugar de la sesión; las cuentas
    sin 2FA no ven ningún cambio.

servers:
  - url: http://localhost:8001
    description: Entorno local (detrás del API Gateway en producción)

paths:
  /users:
    post:
      summary: Registrar un nuevo usuario
      description: >
        CA1 (éxito), CA2 (email duplicado), CA3 (formato de email inválido),
        CA4 (contraseña insegura) de la historia "Registro de usuarios".
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Usuario creado exitosamente. Devuelve el usuario y una sesión activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '409':
          description: El correo electrónico ya está en uso (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Email con formato inválido o contraseña que no cumple los requisitos mínimos (CA3, CA4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions:
    post:
      summary: Iniciar sesión con email y contraseña
      description: >
        CA1 (éxito), CA2 (contraseña incorrecta) y CA3 (email no registrado)
        de la historia "Login con email y contraseña". CA2 y CA3 devuelven la
        misma respuesta genérica para no revelar cuál campo es incorrecto.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >
            Login exitoso. Si la cuenta no tiene 2FA devuelve la sesión
            (`AuthResult`: access y refresh token). Si tiene 2FA activo
            (SCRUM-23) devuelve en su lugar un `MfaChallenge` con
            `mfaRequired: true`, y la sesión se emite recién en
            `POST /sessions/mfa`. El cliente distingue los dos casos por la
            presencia de `mfaRequired`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthResult'
                      - $ref: '#/components/schemas/MfaChallenge'
        '401':
          description: >
            Credenciales inválidas (email no registrado o contraseña
            incorrecta). El mensaje es idéntico en ambos casos (CA2, CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Credenciales correctas pero la cuenta está suspendida (CA1 de
            "Suspender usuario a nivel plataforma"). Se distingue del 401
            para que el cliente muestre "cuenta suspendida" en vez de
            "credenciales inválidas". Solo se devuelve si la contraseña es
            correcta, así no revela el estado de una cuenta ajena.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Demasiados intentos fallidos para ese email (10 cada 15 minutos).
            Cuenta el email escrito, exista o no, así que no revela si la
            cuenta existe; un login correcto limpia el contador. Se suma al
            límite por IP del gateway.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Cerrar sesión
      description: >
        CA5 de "Login con email y contraseña": invalida la sesión actual.
        El token usado en esta llamada no debe poder reutilizarse después.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión invalidada exitosamente.
        '401':
          description: No hay sesión activa o el token ya es inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/refresh:
    post:
      summary: Renovar el access token sin re-autenticación
      description: >
        CA4 de "Login con email y contraseña": permite conservar la acción
        pendiente cuando el access token expiró pero la sesión (refresh
        token) sigue siendo válida.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nuevo access token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '401':
          description: >
            Refresh token inválido, expirado o revocado (sesión expirada,
            redirige a login). Suspender una cuenta revoca todas sus
            sesiones, así que el refresh de un usuario suspendido cae acá.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/verify:
    post:
      summary: Verificar validez y estado de revocación de una sesión
      description: >
        CA 5: Permite al API Gateway comprobar si un access token sigue activo
        o si ya fue revocado mediante DELETE /sessions.
      operationId: verifySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTokenRequest'
      responses:
        '204':
          description: Token válido y sesión activa.
        '401':
          description: Token inválido, expirado o sesión revocada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Formato de petición inválido (cuerpo o token faltante).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/mfa:
    post:
      summary: Completar el login con el segundo factor
      description: >
        CA2, CA3 y CA4 de "Autenticación de dos factores" (SCRUM-23). Segundo
        paso del login de una cuenta con 2FA: se manda el `mfaToken` que
        devolvió `POST /sessions` y un código TOTP de 6 dígitos, o bien un
        código de recuperación (exactamente uno de los dos).

        El `mfaToken` vence a los 5 minutos y admite 5 intentos: al quinto
        error se invalida y hay que volver a iniciar sesión. Un código TOTP
        ya usado, o de un paso de 30 segundos anterior al último aceptado, no
        se acepta (anti-replay). Un código de recuperación sirve una sola vez.
        La suspensión de la cuenta se vuelve a chequear en este paso.
      operationId: verifyMfaLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
      responses:
        '200':
          description: >
            Código válido. Devuelve la sesión. Si se entró con un código de
            recuperación, suma `recoveryCodesRemaining` para recomendar que
            se genere una lista nueva (CA4).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MfaLoginResult'
        '401':
          description: >
            Código incorrecto (CA3), `mfaToken` vencido, ya usado o agotado
            por los 5 intentos. En todos los casos el mensaje es el mismo y el
            cliente decide si vuelve al login por el `detail`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La cuenta fue suspendida después del primer paso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Cuerpo inválido: falta el `mfaToken`, o no viene exactamente uno
            de `code` y `recoveryCode`, o `code` no tiene 6 dígitos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/google:
    post:
      summary: Iniciar sesión con Google
      description: >
        Historia ideal "Login con Google" (SCRUM-21). El cliente obtiene un ID
        token de Google (Google Identity Services en web, `expo-auth-session`
        en mobile) y lo manda acá. `identity` lo verifica: firma, `iss`, `exp`,
        `aud` contra los client ids configurados y `email_verified`.

        La cuenta se busca primero por el `sub` de Google; si no aparece, por
        email verificado y se vincula (CA2); si tampoco existe, se crea (CA1).
        Una cuenta creada así no tiene contraseña y no puede entrar por
        `POST /sessions`. Si la cuenta tiene 2FA, responde `MfaChallenge`, igual
        que el login normal.
      operationId: loginWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: >
            Login exitoso. `AuthResult` o, si la cuenta tiene 2FA,
            `MfaChallenge`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthResult'
                      - $ref: '#/components/schemas/MfaChallenge'
        '401':
          description: ID token inválido, vencido, de otra audiencia o con el email sin verificar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La cuenta está suspendida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            No se pudo contactar a Google para validar el token (CA3). El
            cliente muestra "No pudimos conectar con Google. Ingresá con tu
            correo y contraseña" y deja visible el formulario normal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /password-resets:
    post:
      summary: Pedir el link para recuperar la contraseña
      description: >
        CA1 y CA4 de "Recupero de contraseña" (SCRUM-20). Responde siempre
        `202` con el mismo cuerpo, exista o no la cuenta, esté suspendida o
        no, y se haya superado o no el límite de emails por cuenta (3 por
        hora). Así no revela qué emails están registrados. El email se manda
        en segundo plano para que el tiempo de respuesta tampoco lo revele.

        El link lleva el token en el fragmento
        (`<PASSWORD_RESET_URL>#token=...`), que no viaja al servidor. El token
        es de un solo uso, vence en 1 hora y pedir uno nuevo invalida los
        anteriores de esa cuenta.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Pedido recibido. Si el email está registrado, llega el link.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PasswordResetAccepted'
        '422':
          description: El email no tiene formato válido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /password-resets/check:
    post:
      summary: Verificar que un token de recupero sirve
      description: >
        CA2 de "Recupero de contraseña". Lo usa la pantalla del link para
        avisar si el enlace sirve antes de que el usuario escriba la
        contraseña nueva. No consume el token.
      operationId: checkPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetToken'
      responses:
        '204':
          description: El token existe, no venció y no se usó.
        '400':
          description: >
            El enlace no es válido o ya venció. Es el mismo error para un
            token inexistente, vencido o ya usado (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /password-resets/confirm:
    post:
      summary: Cambiar la contraseña con un token de recupero
      description: >
        CA3 de "Recupero de contraseña". En una sola transacción guarda la
        contraseña nueva, marca el token como usado y revoca todas las
        sesiones de la cuenta (sus `jti` van al denylist de Redis, ADR-0010).
        El recupero no saltea el 2FA: si la cuenta lo tiene activo, el login
        siguiente lo sigue pidiendo.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Contraseña cambiada y sesiones anteriores revocadas.
        '400':
          description: El enlace no es válido o ya venció (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            La contraseña nueva no cumple los requisitos mínimos (mismas
            reglas que el registro). El token no se consume.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      summary: Ver el perfil propio
      description: >
        CA1 de "Visualización de perfil propio": nombre, foto, descripción y
        fecha de registro. (Estado de actividad queda fuera de este sprint.)
      operationId: getOwnProfile
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'

    patch:
      summary: Editar el perfil propio
      description: >
        CA1 (edición exitosa), CA2 (foto de perfil actualizada) y CA3 (datos
        inválidos) de la historia "Edición de perfil". La imagen se sube
        aparte vía /users/me/avatar; este endpoint acepta la URL ya persistida
        en almacenamiento externo de objetos.
      operationId: updateOwnProfile
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado. Los cambios se reflejan de inmediato (CA1, CA2).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          description: Datos que no cumplen las validaciones del sistema (CA3). No se persisten cambios.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/avatar:
    put:
      summary: Subir o reemplazar la foto de perfil
      description: >
        CA2 de "Edición de perfil". El archivo se almacena en un servicio
        externo de objetos (S3/GCS/Cloudinary); solo se persiste la URL
        resultante en `avatarUrl`. Formatos aceptados JPEG/PNG/WebP, hasta 5MB
        (Requisitos No Funcionales — Gestión de imágenes y media).
      operationId: updateAvatar
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Imagen subida y perfil actualizado con la nueva URL.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          description: Formato o tamaño de archivo no soportado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Servicio de almacenamiento (Cloudinary) no disponible.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Tiempo de espera agotado al subir el avatar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/mfa/setup:
    post:
      summary: Empezar la activación del 2FA
      description: >
        CA1 de "Autenticación de dos factores" (SCRUM-23). Genera un secreto
        TOTP, lo guarda cifrado y todavía sin activar, y devuelve el secreto y
        la URI `otpauth://` con la que el cliente dibuja el QR (el servidor no
        genera imágenes). Llamarlo de nuevo antes de activar pisa el secreto
        pendiente.
      operationId: setupMfa
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      responses:
        '200':
          description: Secreto pendiente de activación.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MfaSetupResult'
        '409':
          description: El 2FA ya está activo. Hay que desactivarlo antes de volver a configurarlo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/mfa/enable:
    post:
      summary: Activar el 2FA con el primer código
      description: >
        CA1 de "Autenticación de dos factores". Verifica un código TOTP contra
        el secreto pendiente, activa el 2FA y devuelve los 10 códigos de
        recuperación. Es la única vez que se muestran en claro: se guardan
        hasheados.
      operationId: enableMfa
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: 2FA activado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MfaRecoveryCodes'
        '400':
          description: El código no es válido, o no hay una activación pendiente (falta llamar a `setup`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El 2FA ya está activo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/mfa/recovery-codes:
    post:
      summary: Generar una lista nueva de códigos de recuperación
      description: >
        CA4 de "Autenticación de dos factores". Pide un código TOTP vigente
        (no uno de recuperación) y reemplaza la lista: los códigos anteriores
        dejan de servir, usados o no.
      operationId: regenerateMfaRecoveryCodes
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: Lista nueva, mostrada una sola vez.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MfaRecoveryCodes'
        '400':
          description: El código no es válido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El 2FA no está activo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/mfa/disable:
    post:
      summary: Desactivar el 2FA
      description: >
        CA5 de "Autenticación de dos factores". Pide la contraseña de la
        cuenta; borra el secreto y todos los códigos de recuperación. Una
        cuenta creada con Google y sin contraseña no puede desactivarlo por
        acá (409).
      operationId: disableMfa
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '204':
          description: 2FA desactivado.
        '401':
          description: La contraseña es incorrecta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El 2FA no está activo, o la cuenta no tiene contraseña.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos de contraseña en `disable`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}:
    get:
      summary: Ver datos básicos de un usuario por id (uso interno / entre servicios)
      description: >
        No corresponde a una historia de usuario final de este sprint (el
        perfil público es optativo y no está en el CP1). Se expone para que
        `community` y `chat` puedan resolver nombre y avatar al mostrar
        miembros, autores de mensajes, etc. Devuelve únicamente campos
        públicos — nunca email ni contraseña (RNF — Minimización de datos en APIs).
      operationId: getUserPublicById
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos públicos del usuario.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicUser'
        '404':
          description: Usuario inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      summary: Listar usuarios de la plataforma (backoffice)
      description: >
        SCRUM-85. Solo staff: responde 403 si `X-User-Role` no es `staff`
        (el chequeo se evalúa antes que la validación de los query params).
        CA1: `search` busca por email o nombre, con coincidencia parcial y sin
        distinguir mayúsculas. CA2: `status` filtra por estado de la cuenta.
        Paginado por offset, ordenado por `createdAt` desc y `id` desc.
        Devuelve solo los campos necesarios para identificar la cuenta
        (RNF — Minimización de datos en APIs). Incluye `email` aunque es un 
        dato personal: CA1 busca por email y el endpoint es solo para staff, 
        que lo necesita para identificar la cuenta.
      operationId: listUsersForAdmin
      parameters:
        - $ref: '#/components/parameters/XUserRole'
        - in: query
          name: search
          required: false
          description: >
            Texto a buscar en email o nombre. Vacío o solo espacios = sin filtro.
          schema:
            type: string
            maxLength: 100
        - in: query
          name: status
          required: false
          description: Estado de la cuenta. Sin valor, trae todos.
          schema:
            type: string
            enum: [active, suspended]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Página de usuarios que cumplen los filtros.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          description: El usuario autenticado no tiene rol de staff (CA Sin permisos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Parámetros de búsqueda o paginación inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{userId}/suspension:
    post:
      summary: Suspender una cuenta (backoffice)
      description: >
        SCRUM-81. Solo staff. Marca la cuenta como suspendida, revoca todas sus
        sesiones (refresh tokens, y los `jti` de los access tokens van al
        denylist, ADR-0010) y publica `identity.user.suspended` (D4,
        `eventos.md`). Desde ese momento el login responde 403 y el perfil
        público, 404. No se puede suspender a una cuenta staff, tampoco la
        propia. Usa el `X-Correlation-Id` del gateway como `correlationId` del
        evento.
      operationId: suspendUser
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cuenta suspendida. Devuelve el usuario con su estado nuevo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '403':
          description: >
            Dos casos, en este orden de chequeo. (1) El usuario autenticado no
            tiene rol de staff (CA3): `title` "Acceso denegado". (2) La cuenta
            a suspender es de staff, incluida la propia: `title` "Acción no
            permitida". El `type` es `about:blank` en ambos, así que el cliente
            los distingue por `title`/`detail`. El chequeo de rol va antes que
            el 404, y el de objetivo staff después.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe un usuario con ese id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La cuenta ya está suspendida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`userId` no es un UUID."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Reactivar una cuenta suspendida (backoffice)
      description: >
        SCRUM-82. Solo staff. Vuelve la cuenta a activa y publica
        `identity.user.reactivated` (D4, `eventos.md`). El usuario vuelve a
        entrar con un login nuevo: sus sesiones viejas siguen revocadas. Usa el
        `X-Correlation-Id` del gateway como `correlationId` del evento.
      operationId: reactivateUser
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cuenta reactivada. Devuelve el usuario con su estado nuevo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '403':
          description: El usuario autenticado no tiene rol de staff (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe un usuario con ese id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La cuenta no está suspendida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`userId` no es un UUID."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Usado únicamente por endpoints que necesitan el JWT/refresh token en
        sí (ej. logout, para invalidar la sesión concreta), no solo saber
        quién es el usuario. El resto de los endpoints autenticados de este
        servicio usa X-User-Id/X-User-Role, propagados por el API Gateway.

  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Id del usuario autenticado, propagado por el API Gateway a partir
        del JWT ya validado (ver JwtClaims). Este servicio no vuelve a
        validar el JWT en estos endpoints; confía en este header dentro de
        la red interna.
    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        type: string
        enum: [user, staff]
      description: Rol global del usuario autenticado, propagado por el API Gateway.

  schemas:
    User:
      type: object
      description: Representación completa del perfil propio (nunca se devuelve para otros usuarios).
      required: [id, email, name, role, avatarUrl, bio, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum: [user, staff]
          description: >
            Rol global de plataforma (RNF — "Rol de staff de la plataforma"),
            independiente de los roles por servidor de la épica Roles y
            Permisos. No es autoasignable y ningún endpoint lo cambia: se
            otorga con un comando de administración de `identity` que se
            corre contra su base, y el seed de la demo lo usa para crear el
            usuario staff (INF-14). Se incluye en el JWT emitido (RNF — Lineamientos técnicos de
            autenticación) para que el gateway y los servicios puedan
            autorizar endpoints de backoffice sin una llamada adicional.
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          maxLength: 300
          nullable: true
        createdAt:
          type: string
          format: date-time

    PublicUser:
      type: object
      description: Subconjunto público de User, sin email ni datos sensibles.
      required: [id, name, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true

    AuthResult:
      type: object
      required: [user, accessToken, refreshToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: >
            JWT de sesión, firmado por `identity`. Viaja como string opaco en
            este response; ver JwtClaims para la estructura de su payload
            decodificado (RNF — Lineamientos técnicos de autenticación).
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Segundos hasta la expiración del accessToken.

    JwtClaims:
      type: object
      description: >
        Estructura del payload del `accessToken` una vez decodificado. No es
        un body HTTP en sí mismo — documenta el contrato interno que el
        gateway y los demás servicios (`community`, `chat`) deben poder
        interpretar para autorizar requests, en particular para distinguir
        endpoints de backoffice reservados a `role: staff`.
      required: [sub, role, jti, iat, exp]
      properties:
        sub:
          type: string
          format: uuid
          description: userId del usuario autenticado (User.id).
        role:
          type: string
          enum: [user, staff]
          description: >
            Copia de User.role al momento de emitir el token. Un solo valor,
            no una lista. Los endpoints de backoffice exigen `staff` y
            responden 403 con cualquier otro valor; el chequeo lo hace el
            servicio dueño del endpoint con el header X-User-Role. Como es
            una copia, un cambio de rol recién se ve en el próximo token.
        jti:
          type: string
          format: uuid
          description: >
            Id único del token. Es la clave del denylist de Redis con la que
            el gateway rechaza tokens revocados por logout o por suspensión
            (ADR-0010).
        iat:
          type: integer
          description: Unix timestamp de emisión.
        exp:
          type: integer
          description: Unix timestamp de expiración.

    RegisterUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Mínimo 8 caracteres, al menos una mayúscula, una minúscula y un número.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UpdateProfileRequest:
      type: object
      description: Todos los campos son opcionales; se actualizan solo los presentes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 300

    MfaChallenge:
      type: object
      description: >
        Respuesta de `POST /sessions` (y de `POST /sessions/google`) cuando la
        cuenta tiene 2FA activo, en lugar de la sesión.
      required: [mfaRequired, mfaToken]
      properties:
        mfaRequired:
          type: boolean
          enum: [true]
        mfaToken:
          type: string
          description: >
            Token opaco de 32 bytes, de un solo uso, que vence a los 5 minutos
            y admite 5 intentos. Vive solo en memoria del cliente: nunca va a
            storage ni a una URL.

    MfaLoginRequest:
      type: object
      description: Exactamente uno de `code` y `recoveryCode`.
      required: [mfaToken]
      properties:
        mfaToken:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código TOTP de 6 dígitos.
        recoveryCode:
          type: string
          pattern: '^[a-z0-9]{4}-[a-z0-9]{4}$'
          description: Código de recuperación con el formato `xxxx-xxxx`.

    MfaLoginResult:
      allOf:
        - $ref: '#/components/schemas/AuthResult'
        - type: object
          properties:
            recoveryCodesRemaining:
              type: integer
              minimum: 0
              description: >
                Solo viene cuando se entró con un código de recuperación:
                cuántos quedan sin usar.

    MfaSetupResult:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Secreto en base32, para cargarlo a mano en la app autenticadora.
        otpauthUri:
          type: string
          description: >
            URI `otpauth://totp/...` con el issuer "Discordia". El cliente la
            dibuja como QR; en mobile también se puede abrir con `Linking`.

    MfaCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[a-z0-9]{4}-[a-z0-9]{4}$'
          description: Se muestran una sola vez; en la base quedan hasheados.

    MfaDisableRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: ID token (JWT) emitido por Google.

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetAccepted:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Siempre el mismo texto, exista o no la cuenta.
          example: Si el correo está registrado, te va a llegar un link para cambiar la contraseña.

    PasswordResetToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token del fragmento del link (`#token=...`), 43 caracteres base64url.

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          description: Mismas reglas que el registro.

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    VerifyTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT a verificar (con o sin prefijo 'Bearer ').

    AdminUser:
      type: object
      description: >
        Vista de staff de un usuario. No incluye datos de perfil ni credenciales.
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, staff]
        status:
          type: string
          enum: [active, suspended]
          description: >
            Derivado de la fecha de suspensión de la cuenta: SCRUM-81 suspende,
            SCRUM-82 reactiva.
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          description: Cantidad de usuarios que cumplen los filtros, sin paginar.
        limit:
          type: integer
        offset:
          type: integer
