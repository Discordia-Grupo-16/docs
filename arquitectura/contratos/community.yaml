openapi: 3.0.0
info:
  title: Discordia Community Service API
  version: 1.0.0
  description: >
    Servicio `community`. Cubre, del camino crítico del Sprint 1 (CP1):
    Crear servidor (#6), Generar invitación (#7), Unirse a servidor vía
    invitación (#8), Abandonar servidor (#9), Crear canal (#11), Editar
    canal (#12) y Eliminar canal (#13).

    Del CP2 cubre Roles y Permisos: Editar permisos de un rol (SCRUM-61),
    Asignar rol a un miembro (SCRUM-62) —con el listado de miembros que
    necesita— y Definir rol por defecto para nuevos miembros (SCRUM-63). El modelo está en el ADR-0011: un bitmask por servidor,
    el permiso efectivo es el OR de los roles, y `community` es el único que
    lo resuelve.

    Siguen fuera de alcance Moderación, el resto de la épica Servidores
    (transferir propiedad, administrar configuración) y los permisos por canal
    del ADR-0012, que se agregan sin romper este contrato.

servers:
  - url: http://localhost:8002
    description: Entorno local (detrás del API Gateway en producción)

paths:
  /servers:
    post:
      summary: Crear un nuevo servidor
      description: >
        CA1 (éxito), CA2 (nombre inválido) y CA3 (ícono inválido) de "Crear
        servidor". Al crearse se genera automáticamente un canal de texto y
        uno de voz por defecto, y un rol `everyone` marcado como rol por
        defecto (SCRUM-63) con `VIEW_CHANNEL` y `SEND_MESSAGES`, que también
        recibe el creador. El creador queda como owner, y el owner tiene todos
        los permisos sin depender de ningún rol (ADR-0011). El ícono es opcional: si se omite, el
        servidor queda sin ícono y CA1 se cumple igual (la consigna dice
        "nombre del servidor (y opcionalmente un ícono)").
      operationId: createServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Servidor creado, con canal de texto y de voz por defecto.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '422':
          description: >
            Nombre vacío o que excede el largo máximo permitido (CA2), o
            ícono con formato/tamaño no soportado (CA3). El servidor no se
            crea en ningún caso — un ícono inválido no debe crear el
            servidor sin ícono silenciosamente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}:
    get:
      summary: Ver un servidor (requiere ser miembro)
      operationId: getServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Datos del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '403':
          description: El usuario no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/members/me:
    delete:
      summary: Abandonar el servidor
      description: >
        CA1 (abandono exitoso) y CA2 (el owner no puede abandonar
        directamente) de "Abandonar servidor".
      operationId: leaveServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: El usuario dejó de ser miembro del servidor (CA1).
        '409':
          description: >
            El usuario es el owner del servidor y debe transferir la
            propiedad o eliminarlo antes de poder salir (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/members/:
    get:
      summary: Listar los miembros del servidor con los roles de cada uno
      description: >
        Es lo que hace posible asignar un rol desde una pantalla (SCRUM-62):
        los endpoints de asignación se dirigen por `userId`, y sin este
        listado el cliente conoce los roles del servidor pero no a quién
        dárselos.

        Alcanza con ser miembro; no se pide `MANAGE_ROLES`. Ver quién está en
        el servidor no es gestionarlo, y es la misma condición que ya pide
        `GET /servers/{serverId}`. Cambiar un rol sí choca con `MANAGE_ROLES`
        y con la jerarquía, en los dos endpoints de asignación.

        No devuelve nombre ni avatar: son de `identity`, y este servicio no
        guarda copia de datos que no son suyos. El cliente los resuelve con
        `GET /users?ids=` (ver identity.yaml). Tampoco devuelve el id de la
        fila de membresía, porque ningún endpoint se dirige por él.

        La barra final no es decorativa: el gateway enruta
        `/api/v1/servers/{serverId}/members/` y no responde a la forma sin
        barra.
      operationId: listServerMembers
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: >
            Los miembros ordenados por fecha de ingreso. Los roles de cada
            uno vienen ordenados por `position` ascendente, así que el último
            es el más alto de su jerarquía.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerMember'
        '403':
          description: Quien pregunta no es miembro del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Servidor inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/members/{userId}:
    delete:
      summary: Expulsar a un miembro del servidor
      description: >
        CA1, CA2 y CA3 de "Expulsar miembro" (SCRUM-68).

        La expulsión borra la membresía, y con ella las asignaciones de rol
        del miembro, y nada más: no queda registrado en ningún lado. Por eso
        puede volver con cualquier invitación válida, y eso es lo que la separa
        del baneo (`PUT /servers/{serverId}/bans/{userId}`), que además lo
        registra para que no pueda volver. Es el CA1.

        `DELETE` porque borra un recurso, la membresía, igual que
        `DELETE /servers/{serverId}/members/me` cuando el que se va es el
        propio usuario. Por eso mismo no se puede expulsar a uno mismo: para
        eso está ese endpoint.

        Pide `KICK_MEMBERS` (bit 5 del ADR-0011) y respeta la jerarquía de la
        regla 4 de ese ADR: hay que estar **estrictamente** por encima del
        miembro, empatar no alcanza, y el owner no es blanco válido para nadie
        —ni para un `ADMINISTRATOR`—. Eso es el CA2.

        No es idempotente: expulsar a quien no es miembro responde `404`,
        porque no queda ningún estado que afirmar. Tampoco recibe motivo, ya
        que la expulsión no deja registro.

        Publica `community.member.left` con `reason: kicked`, el mismo evento
        que un abandono voluntario o un baneo: `chat` ya corta el acceso con
        él, así que expulsar no necesita un evento nuevo ni un consumidor
        nuevo.
      operationId: kickServerMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: >
            El usuario dejó de ser miembro del servidor (CA1). Puede volver con
            una invitación nueva: no queda baneado.
        '403':
          description: >
            Quien expulsa no tiene `KICK_MEMBERS` (CA3), o el blanco tiene una
            jerarquía igual o superior a la suya, o es el owner, o es el mismo
            que expulsa (CA2). El permiso se chequea antes de buscar al
            miembro, así que alguien sin `KICK_MEMBERS` recibe `403` tanto si
            el usuario es miembro como si no: el código de respuesta no sirve
            para enumerar miembros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >
            Servidor inexistente, o el usuario no es miembro de ese servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/bans/:
    get:
      summary: Listar los baneos del servidor
      description: >
        El listado de baneados de "Revocar baneo" (SCRUM-70): es lo que muestra
        la pantalla de baneados, y de ahí sale el `userId` que se le pasa a
        `DELETE /servers/{serverId}/bans/{userId}` para revocar.

        Pide `BAN_MEMBERS`, el mismo bit que banear y revocar (ADR-0011): solo
        quien puede revocar un baneo puede ver la lista. Ser miembro no
        alcanza, porque quién está baneado y por qué es información de
        moderación.

        No devuelve nombre ni avatar, ni del baneado ni de quien baneó: son de
        `identity`, y este servicio no guarda copia de datos que no son suyos.
        El cliente los resuelve con `GET /users?ids=` (ver identity.yaml).

        La barra final no es decorativa: el gateway enruta
        `/api/v1/servers/{serverId}/bans/` y no responde a la forma sin barra.
      operationId: listServerBans
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: >
            Los baneos del servidor, del más nuevo al más viejo. Una lista
            vacía si no hay ninguno.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerBan'
        '403':
          description: >
            Quien pregunta no tiene `BAN_MEMBERS` (CA2), o no es miembro del
            servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Servidor inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/bans/{userId}:
    put:
      summary: Banear a un miembro del servidor
      description: >
        CA1, CA2 y CA3 de "Banear miembro" (SCRUM-69).

        El baneo tiene dos efectos y el CA1 pide los dos: el miembro pierde el
        acceso —se le borra la membresía, y con ella sus asignaciones de rol— y
        queda registrado para que no pueda volver por ninguna invitación. Lo
        segundo es lo que ya chequea `POST /invites/{code}` contra la misma
        tabla.

        `PUT` y no `DELETE` porque afirma un estado en vez de borrar uno:
        banear a alguien ya baneado es la misma request dos veces, responde
        `204` igual y no vuelve a publicar nada. Por eso tampoco se reintenta
        solo en el gateway (ADR-0009): que sea idempotente lo hace seguro de
        reintentar, pero la decisión sigue siendo del cliente.

        Pide `BAN_MEMBERS` (bit 6 del ADR-0011) y respeta la jerarquía de la
        regla 4 de ese ADR: hay que estar **estrictamente** por encima del
        miembro, empatar no alcanza, y el owner no es blanco válido para nadie
        —ni para un `ADMINISTRATOR`—, porque es la única garantía de que un
        servidor no se queda sin dueño. Eso es el CA2.

        Publica `community.member.left` con `reason: banned`, el mismo evento
        que un abandono voluntario: `chat` ya corta el acceso con él, así que
        banear no necesita un evento nuevo ni un consumidor nuevo.

        Los baneados se listan con `GET /servers/{serverId}/bans/` y un baneo
        se revoca con `DELETE` en este mismo path (SCRUM-70).
      operationId: banServerMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: >
                    Motivo, opcional y sólo para el registro: queda guardado
                    con quién baneó, y no viaja en el evento. Vacío o en blanco
                    se guarda como ausente.
                  maxLength: 500
      responses:
        '204':
          description: >
            El usuario quedó baneado del servidor (CA1). Lo mismo si ya lo
            estaba.
        '403':
          description: >
            Quien banea no tiene `BAN_MEMBERS` (CA3), o el blanco tiene una
            jerarquía igual o superior a la suya, o es el owner (CA2). El
            permiso se chequea antes de buscar al miembro, así que alguien sin
            `BAN_MEMBERS` recibe `403` tanto si el usuario es miembro como si
            no: el código de respuesta no sirve para enumerar miembros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >
            Servidor inexistente, o el usuario no es miembro de ese servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
    delete:
      summary: Revocar el baneo de un usuario
      description: >
        CA1 y CA2 de "Revocar baneo" (SCRUM-70).

        Revocar borra el registro del baneo y nada más: es el mismo registro
        que chequea `POST /invites/{code}`, así que sin él el usuario vuelve a
        poder unirse con cualquier invitación válida. Es el CA1. No lo vuelve
        miembro: tiene que entrar él, aceptando una invitación.

        Es el par del `PUT` sobre el mismo recurso y, como él, idempotente:
        afirma que el usuario no está baneado. Revocar un baneo que no existe
        —porque otro moderador lo revocó antes, o porque nunca lo hubo—
        responde `204` igual.

        Pide `BAN_MEMBERS` (bit 6 del ADR-0011), el mismo bit que banear. Eso
        es el CA2. No hay jerarquía que respetar: el baneado ya no es miembro
        ni tiene roles, así que no hay posición contra la cual comparar.

        No publica ningún evento: nadie lo consume. Cuando el usuario vuelve
        con una invitación sale `community.member.joined`, como en cualquier
        ingreso.
      operationId: revokeServerBan
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: >
            El usuario ya no está baneado del servidor (CA1). Lo mismo si no lo
            estaba. No vuelve a ser miembro: puede entrar con cualquier
            invitación válida.
        '403':
          description: >
            Quien revoca no tiene `BAN_MEMBERS` (CA2), o no es miembro del
            servidor. El permiso se chequea antes de buscar el baneo, así que
            alguien sin `BAN_MEMBERS` recibe `403` tanto si el usuario está
            baneado como si no: el código de respuesta no sirve para enumerar
            baneados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Servidor inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/invites:
    post:
      summary: Generar una invitación al servidor
      description: >
        CA1 de "Generar invitación": crea un link único, configurable con o
        sin expiración y con o sin límite de usos. Requiere permiso de
        invitar en el servidor.
      operationId: createInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invitación creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Invite'
        '403':
          description: El usuario no tiene permiso para invitar en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/invites/{inviteId}:
    delete:
      summary: Revocar una invitación
      description: CA4 de "Generar invitación". El link deja de funcionar inmediatamente.
      operationId: revokeInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - in: path
          name: inviteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitación revocada.
        '403':
          description: El usuario no tiene permiso para gestionar invitaciones en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitación inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invites/{code}:
    get:
      summary: Consultar una invitación por código (previsualización antes de unirse)
      description: >
        Permite mostrar al usuario a qué servidor se va a unir antes de
        confirmar. No requiere autenticación: cualquiera con el link puede
        ver la preview, aún sin cuenta. Usado por el cliente para el flujo
        de "abrir el link e invitar a confirmar" de CA1 de "Unirse a
        servidor vía invitación".
      operationId: previewInvite
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Invitación válida. Devuelve datos públicos del servidor, no la invitación en sí.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/InvitePreview'
        '410':
          description: >
            Invitación expirada, revocada, con límite de usos alcanzado, o
            inexistente (CA2, CA3 de "Generar invitación").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Unirse a un servidor usando un código de invitación
      description: >
        CA1 (ingreso exitoso), CA2 (invitación inválida), CA3 (usuario ya es
        miembro) y CA4 (usuario baneado) de "Unirse a servidor vía
        invitación".
      operationId: joinServerByInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: >
            El usuario ya era miembro del servidor; se lo redirige sin
            duplicar la membresía (CA3).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '201':
          description: El usuario se unió exitosamente al servidor con el rol por defecto (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '410':
          description: Invitación expirada, revocada o inexistente (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario está baneado de este servidor (CA4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels:
    post:
      summary: Crear un canal de texto o de voz en el servidor
      description: >
        CA1 (éxito), CA2 (nombre inválido o duplicado dentro de la misma
        categoría), CA3 (sin permisos) de "Crear canal".
      operationId: createChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Canal creado, visible para los miembros con permiso de verlo (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
        '409':
          description: Nombre ya usado por otro canal en la misma categoría (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nombre vacío (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administración en el servidor (CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar los canales del servidor
      description: Devuelve los canales visibles para el usuario, agrupados por categoría (o sin categoría si no tienen una asignada).
      operationId: listChannels
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Lista de canales del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
        '403':
          description: El usuario no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels/{channelId}:
    patch:
      summary: Editar nombre y/o tema de un canal
      description: CA1 (éxito) y CA2 (sin permisos) de "Editar canal".
      operationId: updateChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Canal actualizado, reflejado para todos los miembros (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
        '422':
          description: Nombre inválido o duplicado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administración (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un canal
      description: >
        CA1 (éxito) y CA3 (sin permisos) de "Eliminar canal". CA2
        (confirmación requerida) es responsabilidad de UX del cliente — se
        espera un paso de confirmación explícita antes de disparar esta
        request, sin una barrera adicional a nivel de contrato. Publica un
        evento para que `chat` elimine el historial de mensajes asociado
        (comunicación asíncrona entre servicios, RNF — Eventos y asincronía).
      operationId: deleteChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Canal eliminado. Su historial de mensajes se elimina de forma permanente vía evento asíncrono (CA1).
        '403':
          description: El usuario no tiene permisos de administración (CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/roles/:
    get:
      summary: Listar los roles del servidor
      description: >
        Ordenados por `position` ascendente. Alcanza con ser miembro: los
        bitmasks dicen qué puede hacer cada rol, así que no son dato público
        para cualquier autenticado que conozca un UUID de servidor.
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Los roles del servidor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          description: Quien pregunta no es miembro del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >
            Servidor inexistente. Va antes que el 403: no existir no es un dato
            que haya que proteger, y chequear la membresía primero haría que un
            servidor que nunca existió conteste "no sos miembro".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

    post:
      summary: Crear un rol
      description: >
        El rol se crea sin ningún permiso y al final de la jerarquía, para que
        crearlo nunca sea una forma indirecta de conceder algo. Los permisos
        se le dan después con el `PATCH`.
      operationId: createRole
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '201':
          description: Rol creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '403':
          description: Quien pide no tiene `MANAGE_ROLES`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Servidor inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: Nombre vacío o de más de 100 caracteres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/roles/{roleId}:
    patch:
      summary: Reemplazar los permisos de un rol
      description: >
        CA1, CA2 y CA3 de "Editar permisos de un rol" (SCRUM-61).

        **Reemplaza**, no suma: lo que no venga en la lista queda revocado. Un
        cliente que mande solo el permiso nuevo revoca el resto sin querer.
        Mandar una lista vacía es válido y deja el rol sin ningún permiso.

        Los permisos van por nombre y nunca por el entero: nadie puede revisar
        en un PR qué habilita `permissions = 73`. El bitmask es un detalle de
        cómo se guardan, y la respuesta trae las dos formas.

        El orden de los chequeos define qué código llega: `MANAGE_ROLES` (403),
        rol inexistente (404), jerarquía (403), permiso desconocido (422) y por
        último el CA2 (409).

        Publica `community.member.permissions-changed` con los permisos ya
        resueltos de cada miembro afectado (ver `arquitectura/eventos.md`).
      operationId: updateRolePermissions
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: El rol con sus permisos nuevos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '403':
          description: >
            Tres motivos distintos, cada uno con su mensaje, porque se
            arreglan de formas distintas:

            1. Quien pide no tiene `MANAGE_ROLES`.

            2. El rol está en su misma posición o por encima en la jerarquía.
            **Esto incluye editar su propio rol más alto**, que es el caso más
            común de quien intenta quitarse la administración: la jerarquía
            corta antes de llegar al 409. La interfaz tiene que mostrar el
            mismo mensaje ante este 403 y ante el 409.

            3. Está concediendo `ADMINISTRATOR` sin tenerlo efectivo. Es el
            único bit con esa regla: los demás se pueden otorgar sin tenerlos,
            porque un administrador de roles cuyo rol no incluye
            `SEND_MESSAGES` tiene que poder dárselo a otros. `ADMINISTRATOR`
            es distinto porque concede todo lo demás, `MANAGE_ROLES`
            incluido. El owner no pasa por esta regla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Servidor o rol inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '409':
          description: >
            CA2 de SCRUM-61, en su caso estricto: quien edita **un rol de
            menor posición que es su única fuente de `ADMINISTRATOR`** (tiene
            otro más alto que no lo concede). El servidor quedaría sin nadie
            que pueda administrarlo.

            No es el caso típico. Editar el propio rol más alto responde 403
            por jerarquía, y si otro rol le sigue dando `ADMINISTRATOR` el
            cambio responde 200, porque se mira el resultado efectivo y no
            este rol solo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '422':
          description: La lista trae un nombre de permiso que no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/roles/{roleId}/default:
    put:
      summary: Elegir el rol que reciben los nuevos miembros
      description: >
        CA1 de "Definir rol por defecto" (SCRUM-63). Marca este rol como el que
        se asigna automáticamente al aceptar una invitación.

        Es exclusivo: marcarlo desmarca el anterior en la misma transacción, así
        que un servidor nunca tiene dos roles por defecto. No hay forma de
        desmarcar sin elegir otro, que es cómo se cumple el CA2 —"hasta que se
        configure otro rol por defecto en su lugar"— mientras no exista el
        endpoint de eliminar un rol.

        Pide la jerarquía además de `MANAGE_ROLES`: marcar como defecto un rol
        por encima del propio sería dárselo a todo el que entre.

        No publica ningún evento: cambiar el defecto no altera los permisos de
        nadie que ya sea miembro, solo los de quien entre después.

        Idempotente: marcar el que ya es defecto responde igual.
      operationId: setDefaultRole
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: El rol es el nuevo defecto del servidor.
        '403':
          description: >
            Quien pide no tiene `MANAGE_ROLES`, o el rol está en su misma
            posición o por encima.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: Servidor o rol inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

  /servers/{serverId}/roles/{roleId}/members/{userId}:
    put:
      summary: Darle un rol a un miembro
      description: >
        CA1 de "Asignar rol a un miembro" (SCRUM-62).

        Idempotente: asignar dos veces el mismo rol deja el mismo estado y
        responde igual. Repetir una asignación no es un error del cliente, así
        que puede reintentar después de una respuesta perdida sin pensarlo.

        Publica `community.member.permissions-changed`.
      operationId: assignRoleToMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: El miembro tiene el rol.
        '403':
          description: >
            Quien pide no tiene `MANAGE_ROLES`, el rol está en su misma
            posición o por encima, o el miembro tiene jerarquía igual o
            superior a la suya. El owner nunca puede ser blanco: nadie está
            por encima suyo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >
            Servidor o rol inexistente, o el usuario no es miembro de este
            servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

    delete:
      summary: Quitarle un rol a un miembro
      description: >
        CA2 de "Asignar rol a un miembro" (SCRUM-62).

        Lo que le den sus otros roles se conserva: el permiso efectivo es el
        OR de todos, así que quitar uno no toca lo que aporta el resto. Por
        eso el evento lleva el bitmask recalculado y no una resta.

        Idempotente igual que la asignación: quitar un rol que el miembro no
        tiene no falla.
      operationId: removeRoleFromMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: El miembro no tiene el rol.
        '403':
          description: Los mismos tres motivos que en el `PUT`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
        '404':
          description: >
            Servidor o rol inexistente, o el usuario no es miembro de este
            servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'

components:
  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Id del usuario autenticado, propagado por el API Gateway a partir
        del JWT ya validado (ver JwtClaims en identity.yaml). Este servicio
        no valida JWT ni acepta llamadas directas sin pasar por el gateway
        en producción; confía en este header dentro de la red interna.
    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        type: string
        enum: [user, staff]
      description: Rol global del usuario autenticado, propagado por el API Gateway.
    ServerId:
      in: path
      name: serverId
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      in: path
      name: channelId
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      in: path
      name: roleId
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
      description: >
        El id del usuario en `identity`, no el de la fila de membresía: este
        servicio no expone ese id porque ningún endpoint se dirige por él.
    InviteCode:
      in: path
      name: code
      required: true
      schema:
        type: string
      description: Código corto de la invitación (no es el UUID interno del recurso).

  schemas:
    Server:
      description: >
        Los nombres de los campos son los que el servicio devuelve hoy
        (`snake_case`), no los que declaraba este contrato (`camelCase`): un
        cliente generado desde la versión anterior pedía `ownerId` y recibía
        `undefined`. El resto de los schemas de este archivo sigue en
        `camelCase` y queda como deuda de INF-01.
      type: object
      required:
        [id, name, description, owner_id, avatar_url, created_at, channels,
         my_permissions, my_permission_names]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
        avatar_url:
          description: >
            Se llama `avatar_url` y no `iconUrl`: no es solo la convención de
            nombres, es otro nombre de campo.
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        channels:
          description: >
            Los canales del servidor, incluidos en la respuesta y no pedidos
            aparte. Llega vacío para quien no tiene `VIEW_CHANNEL`, que es
            cómo este servicio esconde los canales (ADR-0011).
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        my_permissions:
          description: >
            Los permisos de quien pidió el servidor, ya resueltos: el OR de
            sus roles, con el owner y `ADMINISTRATOR` expandidos (ADR-0011).

            Existe para que el cliente no tenga que deducir nada comparando
            `owner_id` con su propio id, ni replicar la regla de los roles. El
            cliente chequea bits; la decisión se toma acá.
          type: integer
          minimum: 0
        my_permission_names:
          description: El mismo valor legible, para no obligar a nadie a hacer la cuenta.
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        file:
          type: string
          format: binary
          description: >
            Ícono del servidor, opcional. JPEG, PNG o WebP, hasta 5 MB (RNF
            — Gestión de imágenes y media). Se almacena en el servicio
            externo de objetos; solo se persiste la URL resultante en
            Server.iconUrl.

    Channel:
      type: object
      required: [id, serverId, name, type, topic, categoryId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum: [text, voice]
        topic:
          type: string
          maxLength: 200
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Null si el canal no está asignado a ninguna categoría (fuera de alcance del Sprint 1; se agrupan todos en "general").
        createdAt:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum: [text, voice]

    UpdateChannelRequest:
      type: object
      description: Todos los campos son opcionales; se actualizan solo los presentes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        topic:
          type: string
          maxLength: 200

    Invite:
      type: object
      required: [id, code, serverId, expiresAt, maxUses, uses, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Código corto usado en la URL de invitación.
        serverId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null si la invitación no expira.
        maxUses:
          type: integer
          nullable: true
          description: Null si no tiene límite de usos.
        uses:
          type: integer
        createdAt:
          type: string
          format: date-time

    InvitePreview:
      type: object
      description: >
        Lo que puede ver quien todavía NO es miembro del servidor (ni
        siquiera necesita estar autenticado) al abrir un link de invitación.
        A diferencia de Invite, no expone id/code/uses/createdAt de la
        invitación en sí (son detalles de gestión, no de preview) y en
        cambio embebe los datos públicos mínimos del Server para que el
        cliente pueda mostrar "te están invitando a <name>" sin una segunda
        llamada — que además no podría hacer sin ser miembro, ya que
        GET /servers/{serverId} devuelve 403 para no-miembros.
      required: [server, expiresAt, memberCount]
      properties:
        server:
          $ref: '#/components/schemas/PublicServer'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null si la invitación no expira. Se muestra para que el usuario sepa si el link está por vencer.
        memberCount:
          type: integer
          description: Cantidad actual de miembros del servidor.

    PublicServer:
      type: object
      description: Subconjunto público de Server, visible para no-miembros a través de una invitación.
      required: [id, name, iconUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconUrl:
          type: string
          format: uri
          nullable: true

    CreateInviteRequest:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          nullable: true
          description: Null o ausente para invitación sin expiración.
        maxUses:
          type: integer
          nullable: true
          description: Null o ausente para invitación sin límite de usos.

    Permission:
      description: >
        Nombre de un permiso de servidor (ADR-0011). Es el vocabulario
        compartido entre `community`, `chat`, la web y el mobile: el entero
        que se guarda es un detalle de `community` y no viaja como contrato.

        Los permisos son **por servidor** en el CP2: quien tiene
        `VIEW_CHANNEL` ve todos los canales o ninguno. Las excepciones por
        canal son el ADR-0012 y no están en este contrato.
      type: string
      enum:
        - VIEW_CHANNEL
        - SEND_MESSAGES
        - CONNECT
        - MANAGE_CHANNELS
        - MANAGE_ROLES
        - KICK_MEMBERS
        - BAN_MEMBERS
        - MANAGE_SERVER
        - ADMINISTRATOR

    Role:
      type: object
      required:
        [id, server_id, name, is_default, permissions, permission_names,
         position, created_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_default:
          description: >
            El rol que recibe todo el que entra al servidor (SCRUM-63). Hay uno
            solo por servidor, y se cambia con
            `PUT /servers/{serverId}/roles/{roleId}/default`. Se puede editar
            como cualquier otro rol: editarlo cambia lo que reciben los que
            entren después.
          type: boolean
        permissions:
          description: >
            Bitmask de los permisos del rol. Es cómo se guardan;
            `permission_names` es la misma información, y es la que hay que
            leer. Viaja porque chequear un bit es más barato que buscar en una
            lista, no porque el cliente tenga que entender la tabla.
          type: integer
          minimum: 0
        permission_names:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        position:
          description: >
            Posición en la jerarquía: más alto es más arriba. Nadie puede
            gestionar un rol en su misma posición o por encima, ni actuar
            sobre un miembro cuyo rol más alto esté a su misma altura o
            arriba. Es la regla que impide que un moderador se promueva.
          type: integer
        created_at:
          type: string
          format: date-time

    UpdateRolePermissionsRequest:
      description: >
        Reemplaza por completo los permisos del rol. Una lista vacía es válida
        y lo deja sin ningún permiso.
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    ServerMember:
      description: >
        Un miembro del servidor. Sin nombre ni avatar, que son de `identity`,
        y sin el id de la fila de membresía, que no le sirve a ningún cliente.
      type: object
      required: [user_id, joined_at, roles]
      properties:
        user_id:
          type: string
          format: uuid
        joined_at:
          type: string
          format: date-time
        roles:
          description: >
            Ordenados por `position` ascendente: el último es el más alto de
            su jerarquía.
          type: array
          items:
            $ref: '#/components/schemas/Role'

    ServerBan:
      description: >
        Un baneo del servidor. Sin nombres ni avatares, que son de `identity`,
        y sin el id de la fila, porque los endpoints se dirigen por `user_id`.
      type: object
      required: [user_id, banned_by, reason, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        banned_by:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          description: >
            Hoy sale sin zona horaria (sin `Z`), así que no cumple `date-time` ni
            `procesos/convenciones.md`: es la deuda conocida de las fechas de `community`.

    DetailError:
      description: >
        La forma de error que `community` devuelve hoy, que **no** es el
        `ErrorResponse` (RFC 7807) que declaran las convenciones de esta
        carpeta. El API Gateway la traduce a `application/problem+json` antes
        de que llegue al cliente, así que `api-gateway.yaml` sí documenta
        problem+json para estos mismos endpoints.

        Se documenta tal como es para que este contrato no describa un
        comportamiento que no existe. Normalizar los errores del servicio es
        deuda de INF-01, no de las historias de permisos.
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - description: El mensaje de una `HTTPException`.
              type: string
            - description: >
                Los errores de validación de FastAPI (422), que llegan como
                lista y no como texto.
              type: array
              items:
                type: object
                properties:
                  loc:
                    type: array
                    items:
                      type: string
                  msg:
                    type: string
                  type:
                    type: string

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
