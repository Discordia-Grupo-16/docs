openapi: 3.0.0
info:
  title: Discordia Community Service API
  version: 1.0.0
  description: >
    Servicio `community`. Cubre, del camino crítico del Sprint 1 (CP1):
    Crear servidor (#6), Generar invitación (#7), Unirse a servidor vía
    invitación (#8), Abandonar servidor (#9), Crear canal (#11), Editar
    canal (#12) y Eliminar canal (#13).

    Del CP2 cubre Roles y Permisos: Editar permisos de un rol (SCRUM-61),
    Asignar rol a un miembro (SCRUM-62) —con el listado de miembros que
    necesita— y Definir rol por defecto para nuevos miembros (SCRUM-63). El modelo está en el ADR-0011: un bitmask por servidor,
    el permiso efectivo es el OR de los roles, y `community` es el único que
    lo resuelve.

    Del CP2 cubre también Moderación: Expulsar miembro (SCRUM-68), Banear
    miembro (SCRUM-69) y Revocar baneo (SCRUM-70).

    Del CP2 cubre también Organización de canales: Organizar canales en
    categorías (SCRUM-39) —crear, renombrar, eliminar y reordenar categorías,
    mover canales a una categoría vía `PATCH` o drag & drop— y Reordenar
    canales (SCRUM-40) —`POST /channels/reorder` recibe la lista completa de
    ids en el orden deseado y actualiza el campo `position` de cada uno—.
    Del CP3 cubre Transferir propiedad del servidor (SCRUM-35) y Eliminar rol
    (SCRUM-64).

    Todos los endpoints exitosos devuelven `{ "data": <recurso> }` y todos los
    errores usan RFC 7807 problem+json (`application/problem+json`) con los
    campos `type`, `title`, `status`, `detail` e `instance` (SCRUM-156).

    Siguen fuera de alcance administrar la configuración del servidor y los
    permisos por canal del ADR-0012, que se agregan sin romper este contrato.

servers:
  - url: http://localhost:8002
    description: Entorno local (detrás del API Gateway en producción)

paths:
  /servers:
    post:
      summary: Crear un nuevo servidor
      description: >
        CA1 (éxito), CA2 (nombre inválido) y CA3 (ícono inválido) de "Crear
        servidor". Al crearse se genera automáticamente un canal de texto y
        uno de voz por defecto, y un rol `everyone` marcado como rol por
        defecto (SCRUM-63) con `VIEW_CHANNEL` y `SEND_MESSAGES`, que también
        recibe el creador. El creador queda como owner, y el owner tiene todos
        los permisos sin depender de ningún rol (ADR-0011). El ícono es opcional: si se omite, el
        servidor queda sin ícono y CA1 se cumple igual (la consigna dice
        "nombre del servidor (y opcionalmente un ícono)").
      operationId: createServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Servidor creado, con canal de texto y de voz por defecto.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '422':
          description: >
            Nombre vacío o que excede el largo máximo permitido (CA2), o
            ícono con formato/tamaño no soportado (CA3). El servidor no se
            crea en ningún caso — un ícono inválido no debe crear el
            servidor sin ícono silenciosamente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Listar los servidores del usuario
      description: >
        Devuelve los servidores de los que es miembro quien llama. Con
        `withUser` devuelve solo los que además comparte con ese usuario: es
        el dato de "servidores en común" del perfil público (SCRUM-26, CA1).
        Si el usuario no existe o no hay servidores en común, la respuesta es
        una lista vacía y no un `404`, para no revelar si la cuenta existe.
      operationId: listServers
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: query
          name: withUser
          required: false
          description: Id del usuario con el que se comparten los servidores.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Servidores del usuario, filtrados por los que comparte con `withUser` si se pasó.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
        '422':
          description: "`withUser` con formato de UUID inválido."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}:
    get:
      summary: Ver un servidor (requiere ser miembro)
      operationId: getServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Datos del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '403':
          description: El usuario no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Editar la configuración del servidor
      description: >
        CA1 (éxito), CA2 (sin permisos) y CA3 (datos inválidos) de "Administrar
        configuración del servidor" (SCRUM-32).

        Solo los campos presentes se actualizan; omitir un campo deja el valor
        actual intacto. Pide `MANAGE_SERVER` (ADR-0011); el owner lo tiene
        siempre.

        El ícono y el banner se suben a Cloudinary: si se envían, `avatar_url` y
        `banner_url` se actualizan con la URL resultante.
      operationId: updateServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Servidor con los datos actualizados (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '403':
          description: El usuario no tiene `MANAGE_SERVER` o no es miembro del servidor (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Nombre vacío o de más de 100 caracteres, o imagen con formato o
            tamaño no soportado (CA3). Formatos aceptados: JPEG, PNG, GIF o WEBP,
            hasta 8 MB.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/members/me:
    delete:
      summary: Abandonar el servidor
      description: >
        CA1 (abandono exitoso) y CA2 (el owner no puede abandonar
        directamente) de "Abandonar servidor".
      operationId: leaveServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: El usuario dejó de ser miembro del servidor (CA1).
        '409':
          description: >
            El usuario es el owner del servidor y debe transferir la
            propiedad o eliminarlo antes de poder salir (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/ownership-transfer:
    get:
      summary: Ver la última transferencia de propiedad del servidor
      description: >
        SCRUM-35. Devuelve la transferencia más reciente del servidor, con su
        `status`. Mientras está `pending`, el owner ve a quién se la propuso
        y puede cancelarla. Cuando el destinatario la rechaza pasa a
        `rejected`, y es lo que le permite al owner mostrar que la rechazó,
        distinto de una cancelación (`cancelled`). Solo lo ve el owner: el
        destinatario ve las suyas con `GET /users/me/ownership-transfers`. El
        cliente lo vuelve a pedir cuando le llega el aviso
        `ownershipTransfers` (ADR-0017).
      operationId: getOwnershipTransfer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: La transferencia más reciente del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OwnershipTransfer'
        '403':
          description: Quien pide no es el owner del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente, o el servidor nunca tuvo una transferencia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Proponer la propiedad del servidor a otro miembro
      description: >
        Primer paso de "Transferir propiedad del servidor" (SCRUM-35, D6).
        Crea una transferencia **pendiente**: la propiedad no cambia hasta
        que el destinatario la acepte (CA1) y no cambia si la rechaza (CA3).
        Hay como mucho una pendiente por servidor; para proponérsela a otro,
        el owner cancela la actual primero. Las ya resueltas no cuentan.


        La pendiente pasa a `cancelled` sola, en la misma transacción, si el
        destinatario deja de ser miembro (abandona, lo expulsan o lo banean),
        así que nunca queda una transferencia pendiente hacia alguien que no
        es miembro (CA2). Si el servidor se elimina, sus transferencias se
        borran con él.


        Publica `community.server.ownership-transfer-changed` para que al
        destinatario y al owner les llegue el aviso al instante (ver
        `arquitectura/eventos.md`).
      operationId: createOwnershipTransfer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnershipTransferRequest'
      responses:
        '201':
          description: La transferencia quedó pendiente de la respuesta del destinatario.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OwnershipTransfer'
        '403':
          description: Quien pide no es el owner del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya hay una transferencia `pending` en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            `to_user_id` no es miembro del servidor (CA2), es el propio owner,
            o no es un UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Cancelar la transferencia de propiedad pendiente
      description: >
        SCRUM-35 (D6). La cancela el owner: la pendiente pasa a `cancelled`.
        Es idempotente: si no hay nada pendiente responde `204` igual, porque el resultado que se pide (que
        no haya transferencia) ya se cumple. Publica
        `community.server.ownership-transfer-changed` solo si había una.
      operationId: cancelOwnershipTransfer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: No queda ninguna transferencia pendiente.
        '403':
          description: Quien pide no es el owner del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/ownership-transfer/acceptance:
    post:
      summary: Aceptar la propiedad del servidor
      description: >
        CA1 de "Transferir propiedad del servidor" (SCRUM-35). Lo hace el
        destinatario. En una sola transacción, el destinatario pasa a ser el
        owner y la transferencia pasa a `accepted`. El owner anterior queda como miembro
        regular, con los roles que ya tenía: los permisos de owner salen de
        serlo y no de un rol (ADR-0011), así que los pierde sin tocar ninguna
        asignación.


        Publica `community.server.ownership-transferred` y
        `community.member.permissions-changed` con los permisos de los dos.


        Es idempotente: si no hay nada pendiente y quien pide ya es el owner,
        responde `204`, así un reintento después de aceptar no falla. Si la
        pendiente es para otro usuario responde `403`, por ejemplo cuando el
        owner canceló y se la propuso a otra persona mientras el destinatario
        tenía el aviso abierto: el cliente vuelve a pedir
        `GET /users/me/ownership-transfers`.
      operationId: acceptOwnershipTransfer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: Quien pide es el owner del servidor (CA1).
        '403':
          description: La transferencia pendiente es para otro usuario.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Servidor inexistente, o no hay ninguna transferencia pendiente y
            quien pide no es el owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/ownership-transfer/rejection:
    post:
      summary: Rechazar la propiedad del servidor
      description: >
        CA3 de "Transferir propiedad del servidor" (SCRUM-35). Lo hace el
        destinatario. La transferencia pasa a `rejected` y la propiedad no
        cambia. Publica `community.server.ownership-transfer-changed`, y el
        owner ve el rechazo al volver a pedir
        `GET /servers/{serverId}/ownership-transfer`.


        Es idempotente: si no hay nada pendiente responde `204`, porque el
        resultado que se pide (que la propiedad no cambie) ya se cumple. Si
        la pendiente es para otro usuario responde `403`.
      operationId: rejectOwnershipTransfer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: No queda ninguna transferencia pendiente para quien pide (CA3).
        '403':
          description: La transferencia pendiente es para otro usuario.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/ownership-transfers:
    get:
      summary: Listar las transferencias de propiedad que esperan mi respuesta
      description: >
        SCRUM-35 (D6). Las transferencias `pending` en las que quien pide es
        el destinatario, una por servidor como mucho. El cliente las muestra
        como un aviso en la app, porque no hay centro de notificaciones, y
        las vuelve a pedir cuando le llega el aviso
        `ownershipTransfers` (ADR-0017).
      operationId: listMyOwnershipTransfers
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Las transferencias pendientes para quien pide; lista vacía si no hay.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnershipTransfer'

  /servers/{serverId}/members/:
    get:
      summary: Listar los miembros del servidor con los roles de cada uno
      description: >
        Es lo que hace posible asignar un rol desde una pantalla (SCRUM-62):
        los endpoints de asignación se dirigen por `userId`, y sin este
        listado el cliente conoce los roles del servidor pero no a quién
        dárselos.

        Alcanza con ser miembro; no se pide `MANAGE_ROLES`. Ver quién está en
        el servidor no es gestionarlo, y es la misma condición que ya pide
        `GET /servers/{serverId}`. Cambiar un rol sí choca con `MANAGE_ROLES`
        y con la jerarquía, en los dos endpoints de asignación.

        No devuelve nombre ni avatar: son de `identity`, y este servicio no
        guarda copia de datos que no son suyos. El cliente los resuelve con
        `GET /users?ids=` (ver identity.yaml). Tampoco devuelve el id de la
        fila de membresía, porque ningún endpoint se dirige por él.

        La barra final no es decorativa: el gateway enruta
        `/api/v1/servers/{serverId}/members/` y no responde a la forma sin
        barra.
      operationId: listServerMembers
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: >
            Los miembros ordenados por fecha de ingreso. Los roles de cada
            uno vienen ordenados por `position` ascendente, así que el último
            es el más alto de su jerarquía.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerMember'
        '403':
          description: Quien pregunta no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/members/{userId}:
    delete:
      summary: Expulsar a un miembro del servidor
      description: >
        CA1, CA2 y CA3 de "Expulsar miembro" (SCRUM-68).

        La expulsión borra la membresía, y con ella las asignaciones de rol
        del miembro, y nada más: no queda registrado en ningún lado. Por eso
        puede volver con cualquier invitación válida, y eso es lo que la separa
        del baneo (`PUT /servers/{serverId}/bans/{userId}`), que además lo
        registra para que no pueda volver. Es el CA1.

        `DELETE` porque borra un recurso, la membresía, igual que
        `DELETE /servers/{serverId}/members/me` cuando el que se va es el
        propio usuario. Por eso mismo no se puede expulsar a uno mismo: para
        eso está ese endpoint.

        Pide `KICK_MEMBERS` (bit 5 del ADR-0011) y respeta la jerarquía de la
        regla 4 de ese ADR: hay que estar **estrictamente** por encima del
        miembro, empatar no alcanza, y el owner no es blanco válido para nadie
        —ni para un `ADMINISTRATOR`—. Eso es el CA2.

        No es idempotente: expulsar a quien no es miembro responde `404`,
        porque no queda ningún estado que afirmar. Tampoco recibe motivo, ya
        que la expulsión no deja registro.

        Publica `community.member.left` con `reason: kicked`, el mismo evento
        que un abandono voluntario o un baneo: `chat` ya corta el acceso con
        él, así que expulsar no necesita un evento nuevo ni un consumidor
        nuevo.
      operationId: kickServerMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: >
            El usuario dejó de ser miembro del servidor (CA1). Puede volver con
            una invitación nueva: no queda baneado.
        '403':
          description: >
            Quien expulsa no tiene `KICK_MEMBERS` (CA3), o el blanco tiene una
            jerarquía igual o superior a la suya, o es el owner, o es el mismo
            que expulsa (CA2). El permiso se chequea antes de buscar al
            miembro, así que alguien sin `KICK_MEMBERS` recibe `403` tanto si
            el usuario es miembro como si no: el código de respuesta no sirve
            para enumerar miembros.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Servidor inexistente, o el usuario no es miembro de ese servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/bans/:
    get:
      summary: Listar los baneos del servidor
      description: >
        El listado de baneados de "Revocar baneo" (SCRUM-70): es lo que muestra
        la pantalla de baneados, y de ahí sale el `userId` que se le pasa a
        `DELETE /servers/{serverId}/bans/{userId}` para revocar.

        Pide `BAN_MEMBERS`, el mismo bit que banear y revocar (ADR-0011): solo
        quien puede revocar un baneo puede ver la lista. Ser miembro no
        alcanza, porque quién está baneado y por qué es información de
        moderación.

        No devuelve nombre ni avatar, ni del baneado ni de quien baneó: son de
        `identity`, y este servicio no guarda copia de datos que no son suyos.
        El cliente los resuelve con `GET /users?ids=` (ver identity.yaml).

        La barra final no es decorativa: el gateway enruta
        `/api/v1/servers/{serverId}/bans/` y no responde a la forma sin barra.
      operationId: listServerBans
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: >
            Los baneos del servidor, del más nuevo al más viejo. Una lista
            vacía si no hay ninguno.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerBan'
        '403':
          description: >
            Quien pregunta no tiene `BAN_MEMBERS` (CA2), o no es miembro del
            servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/bans/{userId}:
    put:
      summary: Banear a un miembro del servidor
      description: >
        CA1, CA2 y CA3 de "Banear miembro" (SCRUM-69).

        El baneo tiene dos efectos y el CA1 pide los dos: el miembro pierde el
        acceso —se le borra la membresía, y con ella sus asignaciones de rol— y
        queda registrado para que no pueda volver por ninguna invitación. Lo
        segundo es lo que ya chequea `POST /invites/{code}` contra la misma
        tabla.

        `PUT` y no `DELETE` porque afirma un estado en vez de borrar uno:
        banear a alguien ya baneado es la misma request dos veces, responde
        `204` igual y no vuelve a publicar nada. Por eso tampoco se reintenta
        solo en el gateway (ADR-0009): que sea idempotente lo hace seguro de
        reintentar, pero la decisión sigue siendo del cliente.

        Pide `BAN_MEMBERS` (bit 6 del ADR-0011) y respeta la jerarquía de la
        regla 4 de ese ADR: hay que estar **estrictamente** por encima del
        miembro, empatar no alcanza, y el owner no es blanco válido para nadie
        —ni para un `ADMINISTRATOR`—, porque es la única garantía de que un
        servidor no se queda sin dueño. Eso es el CA2.

        Publica `community.member.left` con `reason: banned`, el mismo evento
        que un abandono voluntario: `chat` ya corta el acceso con él, así que
        banear no necesita un evento nuevo ni un consumidor nuevo.

        Los baneados se listan con `GET /servers/{serverId}/bans/` y un baneo
        se revoca con `DELETE` en este mismo path (SCRUM-70).
      operationId: banServerMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: >
                    Motivo, opcional y sólo para el registro: queda guardado
                    con quién baneó, y no viaja en el evento. Vacío o en blanco
                    se guarda como ausente.
                  maxLength: 500
      responses:
        '204':
          description: >
            El usuario quedó baneado del servidor (CA1). Lo mismo si ya lo
            estaba.
        '403':
          description: >
            Quien banea no tiene `BAN_MEMBERS` (CA3), o el blanco tiene una
            jerarquía igual o superior a la suya, o es el owner (CA2). El
            permiso se chequea antes de buscar al miembro, así que alguien sin
            `BAN_MEMBERS` recibe `403` tanto si el usuario es miembro como si
            no: el código de respuesta no sirve para enumerar miembros.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Servidor inexistente, o el usuario no es miembro de ese servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Motivo de más de 500 caracteres. Se mide **después** de recortar los
            espacios, así que un motivo válido rodeado de espacios no se rechaza.

            Es el único de los códigos de este endpoint que se evalúa **antes**
            que el resto: es validación de entrada pura, no depende del estado
            del servidor, así que no filtra nada y falla rápido. Un motivo
            inválido contra un servidor inexistente responde `422`, no `404`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                
    delete:
      summary: Revocar el baneo de un usuario
      description: >
        CA1 y CA2 de "Revocar baneo" (SCRUM-70).

        Revocar borra el registro del baneo y nada más: es el mismo registro
        que chequea `POST /invites/{code}`, así que sin él el usuario vuelve a
        poder unirse con cualquier invitación válida. Es el CA1. No lo vuelve
        miembro: tiene que entrar él, aceptando una invitación.

        Es el par del `PUT` sobre el mismo recurso y, como él, idempotente:
        afirma que el usuario no está baneado. Revocar un baneo que no existe
        —porque otro moderador lo revocó antes, o porque nunca lo hubo—
        responde `204` igual.

        Pide `BAN_MEMBERS` (bit 6 del ADR-0011), el mismo bit que banear. Eso
        es el CA2. No hay jerarquía que respetar: el baneado ya no es miembro
        ni tiene roles, así que no hay posición contra la cual comparar.

        No publica ningún evento: nadie lo consume. Cuando el usuario vuelve
        con una invitación sale `community.member.joined`, como en cualquier
        ingreso.
      operationId: revokeServerBan
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: >
            El usuario ya no está baneado del servidor (CA1). Lo mismo si no lo
            estaba. No vuelve a ser miembro: puede entrar con cualquier
            invitación válida.
        '403':
          description: >
            Quien revoca no tiene `BAN_MEMBERS` (CA2), o no es miembro del
            servidor. El permiso se chequea antes de buscar el baneo, así que
            alguien sin `BAN_MEMBERS` recibe `403` tanto si el usuario está
            baneado como si no: el código de respuesta no sirve para enumerar
            baneados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/invites:
    post:
      summary: Generar una invitación al servidor
      description: >
        CA1 de "Generar invitación": crea un link único, configurable con o
        sin expiración y con o sin límite de usos. Requiere permiso de
        invitar en el servidor.
      operationId: createInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invitación creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Invite'
        '403':
          description: El usuario no tiene permiso para invitar en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/invites/{inviteId}:
    delete:
      summary: Revocar una invitación
      description: CA4 de "Generar invitación". El link deja de funcionar inmediatamente.
      operationId: revokeInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - in: path
          name: inviteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitación revocada.
        '403':
          description: El usuario no tiene permiso para gestionar invitaciones en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitación inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invites/{code}:
    get:
      summary: Consultar una invitación por código (previsualización antes de unirse)
      description: >
        Permite mostrar al usuario a qué servidor se va a unir antes de
        confirmar. No requiere autenticación: cualquiera con el link puede
        ver la preview, aún sin cuenta. Usado por el cliente para el flujo
        de "abrir el link e invitar a confirmar" de CA1 de "Unirse a
        servidor vía invitación".
      operationId: previewInvite
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Invitación válida. Devuelve datos públicos del servidor, no la invitación en sí.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/InvitePreview'
        '410':
          description: >
            Invitación expirada, revocada, con límite de usos alcanzado, o
            inexistente (CA2, CA3 de "Generar invitación").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Unirse a un servidor usando un código de invitación
      description: >
        CA1 (ingreso exitoso), CA2 (invitación inválida), CA3 (usuario ya es
        miembro) y CA4 (usuario baneado) de "Unirse a servidor vía
        invitación". Devuelve 200 en ambos casos exitosos: unirse por primera
        vez (CA1) y ya ser miembro (CA3).
      operationId: joinServerByInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: >
            El usuario se unió al servidor (CA1) o ya era miembro (CA3).
            Devuelve la membresía resultante.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
        '410':
          description: Invitación expirada, revocada o inexistente (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario está baneado de este servidor (CA4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels:
    post:
      summary: Crear un canal de texto o de voz en el servidor
      description: >
        CA1 (éxito), CA2 (nombre inválido o duplicado dentro de la misma
        categoría), CA3 (sin permisos) de "Crear canal".
      operationId: createChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Canal creado, visible para los miembros con permiso de verlo (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
        '409':
          description: Nombre ya usado por otro canal en la misma categoría (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nombre vacío (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administración en el servidor (CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar los canales del servidor
      description: Devuelve los canales visibles para el usuario, agrupados por categoría (o sin categoría si no tienen una asignada).
      operationId: listChannels
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Lista de canales del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
        '403':
          description: El usuario no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels/{channelId}:
    patch:
      summary: Editar nombre y/o tema de un canal
      description: CA1 (éxito) y CA2 (sin permisos) de "Editar canal".
      operationId: updateChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Canal actualizado, reflejado para todos los miembros (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
        '422':
          description: Nombre inválido o duplicado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administración (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un canal
      description: >
        CA1 (éxito) y CA3 (sin permisos) de "Eliminar canal". CA2
        (confirmación requerida) es responsabilidad de UX del cliente — se
        espera un paso de confirmación explícita antes de disparar esta
        request, sin una barrera adicional a nivel de contrato. Publica un
        evento para que `chat` elimine el historial de mensajes asociado
        (comunicación asíncrona entre servicios, RNF — Eventos y asincronía).
      operationId: deleteChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Canal eliminado. Su historial de mensajes se elimina de forma permanente vía evento asíncrono (CA1).
        '403':
          description: El usuario no tiene permisos de administración (CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels/reorder:
    post:
      summary: Reordenar los canales del servidor (SCRUM-40)
      description: >
        CA1 de "Reordenar canales". Recibe la lista **completa** de ids de
        canales del servidor en el orden deseado y asigna posiciones
        consecutivas (0, 1, 2 …) manteniendo ese orden global.

        La lista completa es obligatoria para evitar colisiones de `position`
        entre canales de distintos grupos: si se mandaran solo los de una
        categoría, sus posiciones 0,1,2 colisionarían con las de los otros.

        Pide `MANAGE_CHANNELS`. Devuelve `204` sin cuerpo; el cliente ya
        aplicó el cambio de forma optimista y solo revierte si falla.

        Si algún id de la lista no pertenece al servidor, responde `400`.
      operationId: reorderChannels
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Lista completa de ids de canales en el orden deseado.
      responses:
        '204':
          description: Posiciones actualizadas.
        '400':
          description: Algún id de la lista no pertenece a este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene `MANAGE_CHANNELS`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/categories/:
    post:
      summary: Crear una categoría en el servidor (SCRUM-39)
      description: >
        CA1 de "Organizar canales en categorías". Crea una categoría nueva,
        vacía, en el servidor. Se ubica al final de la lista (posición más
        alta). Pide `MANAGE_CHANNELS`.
      operationId: createCategory
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '403':
          description: El usuario no tiene `MANAGE_CHANNELS`, o no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe una categoría con ese nombre en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nombre vacío o de más de 100 caracteres.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/categories/{categoryId}:
    patch:
      summary: Renombrar una categoría (SCRUM-39)
      description: >
        Renombra la categoría. Pide `MANAGE_CHANNELS`. El nombre se recorta
        antes de validarse, así que un nombre rodeado de espacios no se rechaza
        sino que se guarda sin ellos.
      operationId: renameCategory
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Categoría renombrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '403':
          description: El usuario no tiene `MANAGE_CHANNELS`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor o categoría inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe una categoría con ese nombre en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nombre vacío o de más de 100 caracteres.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar una categoría (SCRUM-39)
      description: >
        Elimina la categoría. Los canales que estaban en ella quedan con
        `category_id = null` —sin categoría— y no se eliminan. Pide
        `MANAGE_CHANNELS`.
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Categoría eliminada. Sus canales quedan sin categoría.
        '403':
          description: El usuario no tiene `MANAGE_CHANNELS`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor o categoría inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/categories/reorder:
    post:
      summary: Reordenar las categorías del servidor (SCRUM-39)
      description: >
        Recibe la lista completa de ids de categorías en el orden deseado y
        asigna posiciones consecutivas. Mismo contrato que el reorder de
        canales. Pide `MANAGE_CHANNELS`.
      operationId: reorderCategories
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Lista completa de ids de categorías en el orden deseado.
      responses:
        '204':
          description: Posiciones actualizadas.
        '400':
          description: Algún id de la lista no pertenece a este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene `MANAGE_CHANNELS`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/roles/:
    get:
      summary: Listar los roles del servidor
      description: >
        Ordenados por `position` ascendente. Alcanza con ser miembro: los
        bitmasks dicen qué puede hacer cada rol, así que no son dato público
        para cualquier autenticado que conozca un UUID de servidor.
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Los roles del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '403':
          description: Quien pregunta no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Servidor inexistente. Va antes que el 403: no existir no es un dato
            que haya que proteger, y chequear la membresía primero haría que un
            servidor que nunca existió conteste "no sos miembro".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un rol
      description: >
        El rol se crea **sin ningún permiso** y en el **punto más bajo de la
        jerarquía**, justo encima del rol por defecto, empujando un lugar para
        arriba a todos los demás. Sin permisos para que crearlo nunca sea una
        forma indirecta de conceder algo —se los da después el `PATCH`, que sí
        chequea jerarquía—, y abajo para que tampoco sea una forma indirecta de
        quedar por encima de los roles que ya existían.

        Dos consecuencias para el cliente: el `position` de los otros roles del
        servidor **cambia** con esta llamada, así que una lista ya cargada queda
        vieja y hay que releerla; y el orden entre dos roles es el inverso al de
        creación. Ver el ADR-0001 de `community`.
      operationId: createRole
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '201':
          description: Rol creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
        '403':
          description: Quien pide no tiene `MANAGE_ROLES`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nombre vacío o de más de 100 caracteres.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/roles/{roleId}:
    patch:
      summary: Reemplazar los permisos de un rol
      description: >
        CA1, CA2 y CA3 de "Editar permisos de un rol" (SCRUM-61).

        **Reemplaza**, no suma: lo que no venga en la lista queda revocado. Un
        cliente que mande solo el permiso nuevo revoca el resto sin querer.
        Mandar una lista vacía es válido y deja el rol sin ningún permiso.

        Los permisos van por nombre y nunca por el entero: nadie puede revisar
        en un PR qué habilita `permissions = 73`. El bitmask es un detalle de
        cómo se guardan, y la respuesta trae las dos formas.

        El orden de los chequeos define qué código llega: `MANAGE_ROLES` (403),
        rol inexistente (404), jerarquía (403), permiso desconocido (422) y por
        último el CA2 (409).

        Publica `community.member.permissions-changed` con los permisos ya
        resueltos de cada miembro afectado (ver `arquitectura/eventos.md`).
      operationId: updateRolePermissions
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: El rol con sus permisos nuevos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
        '403':
          description: >
            Tres motivos distintos, cada uno con su mensaje, porque se
            arreglan de formas distintas:

            1. Quien pide no tiene `MANAGE_ROLES`.

            2. El rol está en su misma posición o por encima en la jerarquía.
            **Esto incluye editar su propio rol más alto**, que es el caso más
            común de quien intenta quitarse la administración: la jerarquía
            corta antes de llegar al 409. La interfaz tiene que mostrar el
            mismo mensaje ante este 403 y ante el 409.

            3. Está concediendo `ADMINISTRATOR` sin tenerlo efectivo. Es el
            único bit con esa regla: los demás se pueden otorgar sin tenerlos,
            porque un administrador de roles cuyo rol no incluye
            `SEND_MESSAGES` tiene que poder dárselo a otros. `ADMINISTRATOR`
            es distinto porque concede todo lo demás, `MANAGE_ROLES`
            incluido. El owner no pasa por esta regla.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor o rol inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            CA2 de SCRUM-61, en su caso estricto: quien edita **un rol de
            menor posición que es su única fuente de `ADMINISTRATOR`** (tiene
            otro más alto que no lo concede). El servidor quedaría sin nadie
            que pueda administrarlo.

            No es el caso típico. Editar el propio rol más alto responde 403
            por jerarquía, y si otro rol le sigue dando `ADMINISTRATOR` el
            cambio responde 200, porque se mira el resultado efectivo y no
            este rol solo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: La lista trae un nombre de permiso que no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un rol
      description: >
        CA1 y CA2 de "Eliminar rol" (SCRUM-64), y CA2 de "Definir rol por
        defecto" (SCRUM-63).


        Borra el rol y sus asignaciones, así que quienes lo tenían dejan de
        contar con los permisos que daba (CA1). Publica
        `community.member.permissions-changed` con los permisos ya resueltos
        de esos miembros, si había alguno (D7). Publica siempre
        `community.role.deleted` con `serverId` y `roleId`, aunque nadie
        tuviera el rol, para que todos los miembros vean desaparecer el rol
        sin recargar (ADR-0017).


        Las posiciones de los demás roles no cambian. Queda un hueco, y no
        importa: la jerarquía solo compara posiciones.


        El orden de los chequeos define qué código llega: `MANAGE_ROLES`
        (403), rol inexistente (404), jerarquía (403), rol por defecto (409)
        y por último quedarse sin `ADMINISTRATOR` (409).
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: El rol se eliminó (CA1).
        '403':
          description: >
            Quien pide no tiene `MANAGE_ROLES` (CA2), o el rol está en su misma
            posición o por encima en la jerarquía (D7). El owner no pasa por la
            jerarquía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor o rol inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Dos motivos, cada uno con su mensaje:


            1. Es el rol por defecto del servidor. Se puede eliminar después
            de elegir otro con `PUT .../roles/{roleId}/default` (CA2 de
            SCRUM-63).


            2. Es la única fuente de `ADMINISTRATOR` de quien lo elimina: el
            servidor quedaría sin nadie que pueda administrarlo. Es la misma
            regla que el `409` de `PATCH`, y como ahí se mira el resultado
            efectivo: si otro rol le sigue dando `ADMINISTRATOR`, se elimina.
            El owner nunca llega a este caso: sus permisos salen de ser owner
            y no de un rol.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/roles/{roleId}/default:
    put:
      summary: Elegir el rol que reciben los nuevos miembros
      description: >
        CA1 de "Definir rol por defecto" (SCRUM-63). Marca este rol como el que
        se asigna automáticamente al aceptar una invitación.

        Es exclusivo: marcarlo desmarca el anterior en la misma transacción, así
        que un servidor nunca tiene dos roles por defecto. No hay forma de
        desmarcar sin elegir otro, que es cómo se cumple el CA2 —"hasta que se
        configure otro rol por defecto en su lugar"— mientras no exista el
        endpoint de eliminar un rol.

        Pide la jerarquía además de `MANAGE_ROLES`: marcar como defecto un rol
        por encima del propio sería dárselo a todo el que entre.

        No publica ningún evento: cambiar el defecto no altera los permisos de
        nadie que ya sea miembro, solo los de quien entre después.

        Idempotente: marcar el que ya es defecto responde igual.
      operationId: setDefaultRole
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: El rol es el nuevo defecto del servidor.
        '403':
          description: >
            Quien pide no tiene `MANAGE_ROLES`, o el rol está en su misma
            posición o por encima.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor o rol inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/roles/{roleId}/members/{userId}:
    put:
      summary: Darle un rol a un miembro
      description: >
        CA1 de "Asignar rol a un miembro" (SCRUM-62).

        Idempotente: asignar dos veces el mismo rol deja el mismo estado y
        responde igual. Repetir una asignación no es un error del cliente, así
        que puede reintentar después de una respuesta perdida sin pensarlo.

        Publica `community.member.permissions-changed`.
      operationId: assignRoleToMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: El miembro tiene el rol.
        '403':
          description: >
            Quien pide no tiene `MANAGE_ROLES`, el rol está en su misma
            posición o por encima, o el miembro tiene jerarquía igual o
            superior a la suya. El owner nunca puede ser blanco: nadie está
            por encima suyo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Servidor o rol inexistente, o el usuario no es miembro de este
            servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Quitarle un rol a un miembro
      description: >
        CA2 de "Asignar rol a un miembro" (SCRUM-62).

        Lo que le den sus otros roles se conserva: el permiso efectivo es el
        OR de todos, así que quitar uno no toca lo que aporta el resto. Por
        eso el evento lleva el bitmask recalculado y no una resta.

        Idempotente igual que la asignación: quitar un rol que el miembro no
        tiene no falla.
      operationId: removeRoleFromMember
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: El miembro no tiene el rol.
        '403':
          description: Los mismos tres motivos que en el `PUT`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Servidor o rol inexistente, o el usuario no es miembro de este
            servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/servers:
    get:
      summary: Listar servidores de la plataforma (backoffice)
      description: >
        Solo staff: responde 403 si `X-User-Role` no es `staff` (el chequeo se evalúa antes que la validación de los query params).
        `search` busca por nombre de servidor con coincidencia parcial.
        Paginado por offset. Devuelve solo los campos necesarios para identificar al servidor en el backoffice.
      operationId: listServersForAdmin
      parameters:
        - $ref: '#/components/parameters/XUserRole'
        - in: query
          name: search
          required: false
          description: >
            Texto a buscar en el nombre del servidor. Vacío o solo espacios = sin filtro.
          schema:
            type: string
            maxLength: 100
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Página de servidores que cumplen los filtros.
          content:
            application/json:
              schema:
                type: object
                required: [ data, meta ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminServer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          description: El usuario autenticado no tiene rol de staff.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Parámetros de búsqueda o paginación inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/servers/{serverId}:
    delete:
      summary: Eliminar Servidor (backoffice)
      description: >
        Solo staff: responde 403 si `X-User-Role` no es `staff` (el chequeo se evalúa antes que la validación del `serverId`).
        La eliminación es permanente: se eliminan los canales, miembros, invitaciones, roles y baneos del servidor.
        Publica `community.server.deleted` con `{ serverId }`; con ese evento `chat` borra los mensajes del servidor (SCRUM-175).
      operationId: deleteServerForAdmin
      parameters:
        - $ref: '#/components/parameters/XUserRole'
        - name: serverId
          in: path
          required: true
          description: Identificador único del servidor
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Servidor eliminado exitosamente. No devuelve contenido.
        '403':
          description: El usuario autenticado no tiene rol de staff
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El servidor no fue encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Parámetros de eliminación inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Id del usuario autenticado, propagado por el API Gateway a partir
        del JWT ya validado (ver JwtClaims en identity.yaml). Este servicio
        no valida JWT ni acepta llamadas directas sin pasar por el gateway
        en producción; confía en este header dentro de la red interna.
    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        type: string
        enum: [user, staff]
      description: Rol global del usuario autenticado, propagado por el API Gateway.
    ServerId:
      in: path
      name: serverId
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      in: path
      name: channelId
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      in: path
      name: roleId
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
      description: >
        El id del usuario en `identity`, no el de la fila de membresía: este
        servicio no expone ese id porque ningún endpoint se dirige por él.
    InviteCode:
      in: path
      name: code
      required: true
      schema:
        type: string
      description: Código corto de la invitación (no es el UUID interno del recurso).

  schemas:
    Server:
      description: >
        Los nombres de los campos son los que el servicio devuelve hoy
        (`snake_case`), no los que declaraba este contrato (`camelCase`): un
        cliente generado desde la versión anterior pedía `ownerId` y recibía
        `undefined`. El resto de los schemas de este archivo sigue en
        `camelCase` y queda como deuda de INF-01.
      type: object
      required:
        [id, name, description, owner_id, avatar_url, banner_url, created_at,
         channels, categories, my_permissions, my_permission_names]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
        avatar_url:
          description: >
            Se llama `avatar_url` y no `iconUrl`: no es solo la convención de
            nombres, es otro nombre de campo.
          type: string
          format: uri
          nullable: true
        banner_url:
          description: >
            Banner del servidor. Null si no se subió ninguno.
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        channels:
          description: >
            Los canales del servidor, incluidos en la respuesta y no pedidos
            aparte. Llega vacío para quien no tiene `VIEW_CHANNEL`, que es
            cómo este servicio esconde los canales (ADR-0011).
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        categories:
          description: >
            Las categorías del servidor, ordenadas por `position` ascendente
            (SCRUM-39). Lista vacía si no se creó ninguna. Los canales se
            asignan a una categoría a través de `category_id` en `Channel`.
          type: array
          items:
            $ref: '#/components/schemas/Category'
        my_permissions:
          description: >
            Los permisos de quien pidió el servidor, ya resueltos: el OR de
            sus roles, con el owner y `ADMINISTRATOR` expandidos (ADR-0011).

            Existe para que el cliente no tenga que deducir nada comparando
            `owner_id` con su propio id, ni replicar la regla de los roles. El
            cliente chequea bits; la decisión se toma acá.
          type: integer
          minimum: 0
        my_permission_names:
          description: El mismo valor legible, para no obligar a nadie a hacer la cuenta.
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    UpdateServerRequest:
      type: object
      description: Todos los campos son opcionales; se actualizan solo los presentes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        icon:
          type: string
          format: binary
          description: >
            Ícono del servidor. JPEG, PNG, GIF o WEBP, hasta 8 MB. Se sube a
            Cloudinary y actualiza `avatar_url`.
        banner:
          type: string
          format: binary
          description: >
            Banner del servidor. JPEG, PNG, GIF o WEBP, hasta 8 MB. Se sube a
            Cloudinary y actualiza `banner_url`.

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        file:
          type: string
          format: binary
          description: >
            Ícono del servidor, opcional. JPEG, PNG o WebP, hasta 5 MB (RNF
            — Gestión de imágenes y media). Se almacena en el servicio
            externo de objetos; solo se persiste la URL resultante en
            Server.iconUrl.

    Channel:
      description: >
        Los nombres de los campos son snake_case, igual que en `Server`. Ver
        nota en ese schema sobre la deuda INF-01.
      type: object
      required: [id, server_id, name, type, topic, category_id, position, created_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [text, voice]
        topic:
          type: string
          maxLength: 200
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Null si el canal no está asignado a ninguna categoría. El cliente
            lo agrupa visualmente en "Canales de texto" o "Canales de voz"
            según `type`. Se asigna con `PATCH /channels/{channelId}` pasando
            el UUID de la categoría, o se limpia pasando cadena vacía `""`.
        position:
          type: integer
          description: >
            Posición global del canal entre todos los canales del servidor.
            Se actualiza con `POST /channels/reorder` (SCRUM-40).
        created_at:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [text, voice]
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Categoría inicial del canal. Opcional; si se omite el canal queda sin categoría.

    UpdateChannelRequest:
      type: object
      description: Todos los campos son opcionales; se actualizan solo los presentes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        topic:
          type: string
          maxLength: 200
        category_id:
          type: string
          description: >
            UUID de la categoría a la que se mueve el canal, o cadena vacía
            `""` para sacarlo de su categoría actual. Si se omite el campo,
            la categoría no cambia. No es un UUID estricto porque el valor
            vacío también es válido (SCRUM-39).

    Invite:
      type: object
      required: [id, code, serverId, expiresAt, maxUses, uses, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Código corto usado en la URL de invitación.
        serverId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null si la invitación no expira.
        maxUses:
          type: integer
          nullable: true
          description: Null si no tiene límite de usos.
        uses:
          type: integer
        createdAt:
          type: string
          format: date-time

    InvitePreview:
      type: object
      description: >
        Lo que puede ver quien todavía NO es miembro del servidor (ni
        siquiera necesita estar autenticado) al abrir un link de invitación.
        A diferencia de Invite, no expone id/code/uses/createdAt de la
        invitación en sí (son detalles de gestión, no de preview) y en
        cambio embebe los datos públicos mínimos del Server para que el
        cliente pueda mostrar "te están invitando a <name>" sin una segunda
        llamada — que además no podría hacer sin ser miembro, ya que
        GET /servers/{serverId} devuelve 403 para no-miembros.
      required: [server, expiresAt, memberCount]
      properties:
        server:
          $ref: '#/components/schemas/PublicServer'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null si la invitación no expira. Se muestra para que el usuario sepa si el link está por vencer.
        memberCount:
          type: integer
          description: Cantidad actual de miembros del servidor.

    PublicServer:
      type: object
      description: Subconjunto público de Server, visible para no-miembros a través de una invitación.
      required: [id, name, iconUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconUrl:
          type: string
          format: uri
          nullable: true

    CreateInviteRequest:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          nullable: true
          description: Null o ausente para invitación sin expiración.
        maxUses:
          type: integer
          nullable: true
          description: Null o ausente para invitación sin límite de usos.

    Permission:
      description: >
        Nombre de un permiso de servidor (ADR-0011). Es el vocabulario
        compartido entre `community`, `chat`, la web y el mobile: el entero
        que se guarda es un detalle de `community` y no viaja como contrato.

        Los permisos son **por servidor** en el CP2: quien tiene
        `VIEW_CHANNEL` ve todos los canales o ninguno. Las excepciones por
        canal son el ADR-0012 y no están en este contrato.
      type: string
      enum:
        - VIEW_CHANNEL
        - SEND_MESSAGES
        - CONNECT
        - MANAGE_CHANNELS
        - MANAGE_MESSAGES
        - MANAGE_ROLES
        - KICK_MEMBERS
        - BAN_MEMBERS
        - MANAGE_SERVER
        - ADMINISTRATOR

    Role:
      type: object
      required:
        [id, server_id, name, is_default, permissions, permission_names,
         position, created_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_default:
          description: >
            El rol que recibe todo el que entra al servidor (SCRUM-63). Hay uno
            solo por servidor, y se cambia con
            `PUT /servers/{serverId}/roles/{roleId}/default`. Se puede editar
            como cualquier otro rol: editarlo cambia lo que reciben los que
            entren después.
          type: boolean
        permissions:
          description: >
            Bitmask de los permisos del rol. Es cómo se guardan;
            `permission_names` es la misma información, y es la que hay que
            leer. Viaja porque chequear un bit es más barato que buscar en una
            lista, no porque el cliente tenga que entender la tabla.
          type: integer
          minimum: 0
        permission_names:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        position:
          description: >
            Posición en la jerarquía: más alto es más arriba. Nadie puede
            gestionar un rol en su misma posición o por encima, ni actuar
            sobre un miembro cuyo rol más alto esté a su misma altura o
            arriba. Es la regla que impide que un moderador se promueva.
          type: integer
        created_at:
          type: string
          format: date-time

    UpdateRolePermissionsRequest:
      description: >
        Reemplaza por completo los permisos del rol. Una lista vacía es válida
        y lo deja sin ningún permiso.
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Membership:
      description: >
        Resultado de unirse a un servidor. Incluye el id de la fila porque el
        cliente lo usa como clave estable, y server_id para evitar un viaje
        extra al backend.
      type: object
      required: [id, server_id, user_id, joined_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        joined_at:
          type: string
          format: date-time

    OwnershipTransfer:
      description: >
        Una transferencia de propiedad (SCRUM-35, D6). Hay como mucho una
        `pending` por servidor. Al resolverse no se borra: queda con su
        `status`, para que el owner sepa cómo terminó. Sin nombres ni avatares de los usuarios, que son de
        `identity`; sí con el nombre del servidor, para que el destinatario
        pueda mostrar el aviso sin pedirlo aparte.
      type: object
      required: [server_id, server_name, from_user_id, to_user_id, status, created_at, resolved_at]
      properties:
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        from_user_id:
          type: string
          format: uuid
          description: El owner que la propuso.
        to_user_id:
          type: string
          format: uuid
          description: El miembro que tiene que aceptarla o rechazarla.
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled]
          description: >
            `cancelled` es tanto la cancelación del owner como la automática,
            cuando el destinatario deja de ser miembro.
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo dejó de estar `pending`; `null` mientras lo está.

    CreateOwnershipTransferRequest:
      type: object
      required: [to_user_id]
      properties:
        to_user_id:
          type: string
          format: uuid
          description: Un miembro del servidor que no sea el owner (CA2).

    ServerMember:
      description: >
        Un miembro del servidor. Sin nombre ni avatar, que son de `identity`,
        y sin el id de la fila de membresía, que no le sirve a ningún cliente.
      type: object
      required: [user_id, joined_at, roles]
      properties:
        user_id:
          type: string
          format: uuid
        joined_at:
          type: string
          format: date-time
        roles:
          description: >
            Ordenados por `position` ascendente: el último es el más alto de
            su jerarquía.
          type: array
          items:
            $ref: '#/components/schemas/Role'

    ServerBan:
      description: >
        Un baneo del servidor. Sin nombres ni avatares, que son de `identity`,
        y sin el id de la fila, porque los endpoints se dirigen por `user_id`.
      type: object
      required: [user_id, banned_by, reason, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        banned_by:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          description: >
            Hoy sale sin zona horaria (sin `Z`), así que no cumple `date-time` ni
            `procesos/convenciones.md`: es la deuda conocida de las fechas de `community`.

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    AdminServer:
      type: object
      description: Vista de staff de un servidor. No incluye datos profundos como canales o roles.
      required: [ id, name, memberCount, createdAt ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
          description: Cantidad de miembros del servidor.
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      required: [ total, limit, offset ]
      properties:
        total:
          type: integer
          description: Cantidad de servidores que cumplen los filtros, sin paginar.
        limit:
          type: integer
        offset:
          type: integer

    Category:
      description: >
        Una categoría de canales dentro de un servidor (SCRUM-39). Los canales
        que pertenecen a ella lo indican con `category_id`.
      type: object
      required: [id, server_id, name, position, created_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        position:
          type: integer
          description: Orden de la categoría entre las del servidor. Se actualiza con `POST /categories/reorder`.
        created_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre de la categoría. Se recortan los espacios extremos antes de validar.

    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Nuevo nombre de la categoría. Se recortan los espacios extremos antes de validar.
