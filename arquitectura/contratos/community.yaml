openapi: 3.0.0
info:
  title: Discordia Community Service API
  version: 1.0.0
  description: >
    Servicio `community`. Cubre, para el camino crítico del Sprint 1 (CP1):
    Crear servidor (#6), Generar invitación (#7), Unirse a servidor vía
    invitación (#8), Abandonar servidor (#9), Crear canal (#11), Editar
    canal (#12) y Eliminar canal (#13). Roles y Permisos, Moderación y el
    resto de la épica Servidores (transferir propiedad, eliminar servidor,
    administrar configuración) quedan fuera de este sprint como Objetivo
    Ideal o para CP2, y se agregan sin romper este contrato.

servers:
  - url: http://localhost:8002
    description: Entorno local (detrás del API Gateway en producción)

paths:
  /servers:
    post:
      summary: Crear un nuevo servidor
      description: >
        CA1 (éxito), CA2 (nombre inválido) y CA3 (ícono inválido) de "Crear
        servidor". Al crearse se genera automáticamente un canal de texto y
        uno de voz por defecto, y el creador queda como owner con rol por
        defecto de administración. El ícono es opcional: si se omite, el
        servidor queda sin ícono y CA1 se cumple igual (la consigna dice
        "nombre del servidor (y opcionalmente un ícono)").
      operationId: createServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Servidor creado, con canal de texto y de voz por defecto.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '422':
          description: >
            Nombre vacío o que excede el largo máximo permitido (CA2), o
            ícono con formato/tamaño no soportado (CA3). El servidor no se
            crea en ningún caso — un ícono inválido no debe crear el
            servidor sin ícono silenciosamente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar los servidores del usuario
      description: >
        Devuelve los servidores de los que es miembro quien llama. Con
        `withUser` devuelve solo los que además comparte con ese usuario: es
        el dato de "servidores en común" del perfil público (SCRUM-26, CA1).
        Si el usuario no existe o no hay servidores en común, la respuesta es
        una lista vacía y no un `404`, para no revelar si la cuenta existe.
      operationId: listServers
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: query
          name: withUser
          required: false
          description: Id del usuario con el que se comparten los servidores.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Servidores del usuario, filtrados por los que comparte con `withUser` si se pasó.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
        '422':
          description: "`withUser` con formato de UUID inválido."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}:
    get:
      summary: Ver un servidor (requiere ser miembro)
      operationId: getServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Datos del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '403':
          description: El usuario no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servidor inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/members/me:
    delete:
      summary: Abandonar el servidor
      description: >
        CA1 (abandono exitoso) y CA2 (el owner no puede abandonar
        directamente) de "Abandonar servidor".
      operationId: leaveServer
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '204':
          description: El usuario dejó de ser miembro del servidor (CA1).
        '409':
          description: >
            El usuario es el owner del servidor y debe transferir la
            propiedad o eliminarlo antes de poder salir (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/invites:
    post:
      summary: Generar una invitación al servidor
      description: >
        CA1 de "Generar invitación": crea un link único, configurable con o
        sin expiración y con o sin límite de usos. Requiere permiso de
        invitar en el servidor.
      operationId: createInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invitación creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Invite'
        '403':
          description: El usuario no tiene permiso para invitar en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/invites/{inviteId}:
    delete:
      summary: Revocar una invitación
      description: CA4 de "Generar invitación". El link deja de funcionar inmediatamente.
      operationId: revokeInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - in: path
          name: inviteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitación revocada.
        '403':
          description: El usuario no tiene permiso para gestionar invitaciones en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitación inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invites/{code}:
    get:
      summary: Consultar una invitación por código (previsualización antes de unirse)
      description: >
        Permite mostrar al usuario a qué servidor se va a unir antes de
        confirmar. No requiere autenticación: cualquiera con el link puede
        ver la preview, aún sin cuenta. Usado por el cliente para el flujo
        de "abrir el link e invitar a confirmar" de CA1 de "Unirse a
        servidor vía invitación".
      operationId: previewInvite
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Invitación válida. Devuelve datos públicos del servidor, no la invitación en sí.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/InvitePreview'
        '410':
          description: >
            Invitación expirada, revocada, con límite de usos alcanzado, o
            inexistente (CA2, CA3 de "Generar invitación").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Unirse a un servidor usando un código de invitación
      description: >
        CA1 (ingreso exitoso), CA2 (invitación inválida), CA3 (usuario ya es
        miembro) y CA4 (usuario baneado) de "Unirse a servidor vía
        invitación".
      operationId: joinServerByInvite
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: >
            El usuario ya era miembro del servidor; se lo redirige sin
            duplicar la membresía (CA3).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '201':
          description: El usuario se unió exitosamente al servidor con el rol por defecto (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        '410':
          description: Invitación expirada, revocada o inexistente (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario está baneado de este servidor (CA4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels:
    post:
      summary: Crear un canal de texto o de voz en el servidor
      description: >
        CA1 (éxito), CA2 (nombre inválido o duplicado dentro de la misma
        categoría), CA3 (sin permisos) de "Crear canal".
      operationId: createChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Canal creado, visible para los miembros con permiso de verlo (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
        '409':
          description: Nombre ya usado por otro canal en la misma categoría (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nombre vacío (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administración en el servidor (CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar los canales del servidor
      description: Devuelve los canales visibles para el usuario, agrupados por categoría (o sin categoría si no tienen una asignada).
      operationId: listChannels
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Lista de canales del servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
        '403':
          description: El usuario no es miembro del servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /servers/{serverId}/channels/{channelId}:
    patch:
      summary: Editar nombre y/o tema de un canal
      description: CA1 (éxito) y CA2 (sin permisos) de "Editar canal".
      operationId: updateChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Canal actualizado, reflejado para todos los miembros (CA1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
        '422':
          description: Nombre inválido o duplicado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administración (CA2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un canal
      description: >
        CA1 (éxito) y CA3 (sin permisos) de "Eliminar canal". CA2
        (confirmación requerida) es responsabilidad de UX del cliente — se
        espera un paso de confirmación explícita antes de disparar esta
        request, sin una barrera adicional a nivel de contrato. Publica un
        evento para que `chat` elimine el historial de mensajes asociado
        (comunicación asíncrona entre servicios, RNF — Eventos y asincronía).
      operationId: deleteChannel
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Canal eliminado. Su historial de mensajes se elimina de forma permanente vía evento asíncrono (CA1).
        '403':
          description: El usuario no tiene permisos de administración (CA3).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canal inexistente en este servidor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >
        Id del usuario autenticado, propagado por el API Gateway a partir
        del JWT ya validado (ver JwtClaims en identity.yaml). Este servicio
        no valida JWT ni acepta llamadas directas sin pasar por el gateway
        en producción; confía en este header dentro de la red interna.
    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        type: string
        enum: [user, staff]
      description: Rol global del usuario autenticado, propagado por el API Gateway.
    ServerId:
      in: path
      name: serverId
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      in: path
      name: channelId
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      in: path
      name: code
      required: true
      schema:
        type: string
      description: Código corto de la invitación (no es el UUID interno del recurso).

  schemas:
    Server:
      type: object
      required: [id, name, iconUrl, ownerId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        iconUrl:
          type: string
          format: uri
          nullable: true
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        file:
          type: string
          format: binary
          description: >
            Ícono del servidor, opcional. JPEG, PNG o WebP, hasta 5 MB (RNF
            — Gestión de imágenes y media). Se almacena en el servicio
            externo de objetos; solo se persiste la URL resultante en
            Server.iconUrl.

    Channel:
      type: object
      required: [id, serverId, name, type, topic, categoryId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum: [text, voice]
        topic:
          type: string
          maxLength: 200
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Null si el canal no está asignado a ninguna categoría (fuera de alcance del Sprint 1; se agrupan todos en "general").
        createdAt:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum: [text, voice]

    UpdateChannelRequest:
      type: object
      description: Todos los campos son opcionales; se actualizan solo los presentes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        topic:
          type: string
          maxLength: 200

    Invite:
      type: object
      required: [id, code, serverId, expiresAt, maxUses, uses, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Código corto usado en la URL de invitación.
        serverId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null si la invitación no expira.
        maxUses:
          type: integer
          nullable: true
          description: Null si no tiene límite de usos.
        uses:
          type: integer
        createdAt:
          type: string
          format: date-time

    InvitePreview:
      type: object
      description: >
        Lo que puede ver quien todavía NO es miembro del servidor (ni
        siquiera necesita estar autenticado) al abrir un link de invitación.
        A diferencia de Invite, no expone id/code/uses/createdAt de la
        invitación en sí (son detalles de gestión, no de preview) y en
        cambio embebe los datos públicos mínimos del Server para que el
        cliente pueda mostrar "te están invitando a <name>" sin una segunda
        llamada — que además no podría hacer sin ser miembro, ya que
        GET /servers/{serverId} devuelve 403 para no-miembros.
      required: [server, expiresAt, memberCount]
      properties:
        server:
          $ref: '#/components/schemas/PublicServer'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null si la invitación no expira. Se muestra para que el usuario sepa si el link está por vencer.
        memberCount:
          type: integer
          description: Cantidad actual de miembros del servidor.

    PublicServer:
      type: object
      description: Subconjunto público de Server, visible para no-miembros a través de una invitación.
      required: [id, name, iconUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        iconUrl:
          type: string
          format: uri
          nullable: true

    CreateInviteRequest:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          nullable: true
          description: Null o ausente para invitación sin expiración.
        maxUses:
          type: integer
          nullable: true
          description: Null o ausente para invitación sin límite de usos.

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
